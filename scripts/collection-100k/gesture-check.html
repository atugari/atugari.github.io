<!doctype html><meta charset="utf-8"><title>Gesture regression checks</title><pre id="result">Running</pre><main id="fixture"></main>
<script src="/nanpure/collection/board-input.js"></script><script>
addEventListener('load',()=>{const results=[],near=(a,b)=>{if(Math.abs(a-b)>.0001)throw Error(a+' != '+b)},check=(name,run)=>{try{run();results.push({name,passed:true})}catch(e){results.push({name,passed:false,error:e.message})}};let sequence=0;
function fixture(){document.getElementById('fixture').innerHTML='<div class="board-scroll"><div id="board" data-pan-key="test-'+(++sequence)+'"><button data-action="cell">1</button></div></div>';const board=document.getElementById('board'),viewport=board.parentElement,cell=board.firstElementChild;Object.defineProperties(board,{offsetWidth:{value:1000},offsetHeight:{value:1000}});Object.defineProperties(viewport,{clientWidth:{value:300},clientHeight:{value:300},clientLeft:{value:0},clientTop:{value:0}});viewport.getBoundingClientRect=()=>({left:0,top:0,width:300,height:300});NPBoardInput.scan();let clicks=0;viewport.addEventListener('click',()=>clicks++);const send=(type,id,x,y,target=cell,primary=id===1)=>target.dispatchEvent(new PointerEvent(type,{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:primary,button:0,clientX:x,clientY:y}));return {board,viewport,cell,send,scale:()=>+viewport.dataset.scale,clicks:()=>clicks};}
check('one finger changes position without changing scale',()=>{const f=fixture();f.send('pointerdown',1,100,100);f.send('pointermove',1,40,50);near(f.scale(),1);f.send('pointerup',1,40,50)});
check('two fingers can pinch',()=>{const f=fixture();f.send('pointerdown',1,80,100);f.send('pointerdown',2,180,100);f.send('pointermove',2,230,100);near(f.scale(),1.5);f.send('pointerup',2,230,100);f.send('pointerup',1,80,100)});
check('release outside viewport cannot leave phantom second finger',()=>{const f=fixture();f.send('pointerdown',1,80,100);f.send('pointerdown',2,180,100);f.send('pointerup',2,180,100,window);f.send('pointermove',1,40,100);near(f.scale(),1);f.send('pointerup',1,40,100)});
check('fresh primary touch clears a missed previous release',()=>{const f=fixture();f.send('pointerdown',1,80,100);f.send('pointerdown',2,180,100);f.send('pointerdown',3,200,100,f.cell,true);f.send('pointermove',3,240,100);near(f.scale(),1);f.send('pointerup',3,240,100)});
check('touchend with zero contacts clears stale fingers',()=>{const f=fixture();f.send('pointerdown',1,80,100);f.send('pointerdown',2,180,100);window.dispatchEvent(new TouchEvent('touchend',{touches:[]}));f.send('pointerdown',3,200,100);f.send('pointermove',3,240,100);near(f.scale(),1);f.send('pointerup',3,240,100)});
check('cancel outside viewport ends a pending pinch',()=>{const f=fixture();f.send('pointerdown',1,80,100);f.send('pointerdown',2,180,100);f.send('pointercancel',2,180,100,window);f.send('pointermove',1,40,100);near(f.scale(),1);f.send('pointerup',1,40,100)});
check('capture transfer from cell does not terminate movement',()=>{const f=fixture();f.send('pointerdown',1,80,100);f.send('pointerdown',2,180,100);f.send('lostpointercapture',2,180,100);f.send('pointermove',2,230,100,f.viewport);near(f.scale(),1.5);f.send('pointerup',2,230,100);f.send('pointerup',1,80,100)});
check('ordinary taps still reach cell input',()=>{const f=fixture();f.send('pointerdown',1,80,100);f.send('pointerup',1,80,100);f.cell.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,detail:1}));near(f.clicks(),1)});
document.getElementById('result').textContent=JSON.stringify({passed:results.filter(x=>x.passed).length,total:results.length,results},null,2);
});</script>
