<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>1万問の実生成テスト</title><style>body{font:16px system-ui;margin:24px;background:#f7faf6}button{padding:12px 24px}pre{white-space:pre-wrap}iframe{width:960px;height:700px}</style></head><body><h1>1万問の実生成と保存</h1><p>通常9×9・難易度1の異なる問題を、検証専用の保存領域に1問ずつ作成・保存します。</p><button id="run">1万問の生成を開始</button><p id="progress">待機中</p><pre id="metrics"></pre><pre id="results"></pre><div id="game"></div><script id="qa-scope">
// Keep test data separate from every other preview and all real player data.
(()=>{const prefix='qa-real-generation-worker-20261103:',open=indexedDB.open.bind(indexedDB),del=indexedDB.deleteDatabase.bind(indexedDB);indexedDB.open=(name,...args)=>open(prefix+name,...args);indexedDB.deleteDatabase=name=>del(prefix+name);const real=window.localStorage,scoped={getItem:k=>real.getItem(prefix+k),setItem:(k,v)=>real.setItem(prefix+k,v),removeItem:k=>real.removeItem(prefix+k),key:i=>Object.keys(real).filter(k=>k.startsWith(prefix))[i]?.slice(prefix.length)||null};Object.defineProperty(scoped,'length',{get:()=>Object.keys(real).filter(k=>k.startsWith(prefix)).length});Object.defineProperty(window,'localStorage',{value:scoped});})();
</script><script>
const progress=document.querySelector('#progress'),output=document.querySelector('#metrics'),metrics={};
const wait=ms=>new Promise(r=>setTimeout(r,ms));async function until(fn){for(let i=0;i<1000;i++){if(fn())return;await wait(20)}throw Error('Application timeout')}
async function script(src){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.append(s)})}
const req=q=>new Promise((resolve,reject)=>{q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});
function click(w,s){const b=w.document.querySelector(s);if(!b)throw Error('Missing '+s);b.click()}
async function run(){document.querySelector('#run').disabled=true;window.qa={status:'running'};try{
 const version=(await(await fetch('/nanpure/version.json')).json()).version,base='/nanpure/releases/'+version+'/notebook/';
 for(const name of ['common.js','lan-identity.js','pako.min.js','compact.js','transfer.js','storage.js','recovery.js'])await script(base+name);
 await req(indexedDB.deleteDatabase('nanpure-chou-data'));await NPStorage.open();localStorage.setItem('nanpure-auto-next-v1','false');
 const doc=new DOMParser().parseFromString(await(await fetch(base+'index.html')).text(),'text/html');
 const ids=['core-normal','core-big','core-killer','core-rect','core-giant','core-hundred','core-expert','core-master-logic','core-master','core-cover-logic','core-cover','core-resolution-logic','core-resolution','core-deduction','core-neighbor','core-step','core-cross','core-linked','core-variants','core-expansion','core-multi','common-source','generator-source','core-mixed-multi'];
 const source='var global=self;\n'+ids.map(id=>doc.getElementById(id).textContent).join('\n')+'\nself.onmessage=e=>{try{self.postMessage({p:NPGenerate(e.data,()=>{})})}catch(error){self.postMessage({error:String(error)})}}';
 const url=URL.createObjectURL(new Blob([source],{type:'application/javascript'})),worker=new Worker(url);const saves=[],slowSaves=[],longTasks=[],start=performance.now();let duplicates=0;const observer=new PerformanceObserver(list=>{for(const e of list.getEntries())longTasks.push({start:+e.startTime.toFixed(1),duration:+e.duration.toFixed(1)})});observer.observe({entryTypes:['longtask']});
 try{for(let i=0;i<10000;){const p=await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('Generator timeout')),60000);worker.onmessage=e=>{clearTimeout(timer);e.data.error?reject(Error(e.data.error)):resolve(e.data.p)};worker.onerror=e=>{clearTimeout(timer);reject(Error(e.message))};worker.postMessage({kind:'normal',n:9,level:1,count:1,complexity:2})});NP.validate(p);if(NPStorage.hasDigest(NPTransfer.digest(p))){duplicates++;continue}const t=performance.now();await NPStorage.commit([p],{});const duration=performance.now()-t;saves.push(duration);if(duration>50)slowSaves.push({number:i+1,start:+t.toFixed(1),duration:+duration.toFixed(1)});i++;if(i%100===0){progress.textContent=i.toLocaleString()+' / 10,000問を生成・保存（'+((performance.now()-start)/1000).toFixed(1)+'秒）';}}}
 finally{worker.terminate();URL.revokeObjectURL(url)}
 metrics.generateAndPersist10000Ms=+(performance.now()-start).toFixed(1);metrics.uniqueGeneratedCount=NPStorage.library.length;metrics.duplicatesRejected=duplicates;metrics.averagePersistMs=+(saves.reduce((a,b)=>a+b,0)/saves.length).toFixed(2);metrics.maxPersistMs=+Math.max(...saves).toFixed(2);const sorted=saves.slice().sort((a,b)=>a-b);metrics.persistP50Ms=+sorted[4999].toFixed(2);metrics.persistP95Ms=+sorted[9499].toFixed(2);metrics.persistP99Ms=+sorted[9899].toFixed(2);metrics.slowSaves=slowSaves;metrics.longTasks=longTasks;observer.disconnect();metrics.averageFirst100PersistMs=+(saves.slice(0,100).reduce((a,b)=>a+b,0)/100).toFixed(2);metrics.averageLast100PersistMs=+(saves.slice(-100).reduce((a,b)=>a+b,0)/100).toFixed(2);output.textContent=JSON.stringify(metrics,null,2);
 let snapshotStart=performance.now();await NPRecovery.snapshot(true);metrics.workerSnapshot10000Ms=+(performance.now()-snapshotStart).toFixed(1);const snapshot=(await NPRecovery.snapshots())[0],decoded=NPCompact.parse(snapshot.payload);NPRecovery.validate(decoded);metrics.snapshotRoundTripCount=decoded.puzzles.length;if(decoded.puzzles.length!==10000)throw Error('Snapshot roundtrip mismatch');NPStorage.close();let t=performance.now();await NPStorage.open();metrics.reopen10000Ms=+(performance.now()-t).toFixed(1);if(NPStorage.library.length!==10000||!NPStorage.library.every(p=>p._npSummary))throw Error('Catalog count or laziness mismatch');
 t=performance.now();const backup=await NPRecovery.capture();metrics.fullBackup10000Ms=+(performance.now()-t).toFixed(1);metrics.backupBytes=new Blob([JSON.stringify(backup)]).size;NPRecovery.validate(backup);if(backup.puzzles.length!==10000)throw Error('Backup count mismatch');NPStorage.close();
 const iframe=document.createElement('iframe');iframe.src=base+'index.html#numbers';document.querySelector('#game').append(iframe);t=performance.now();await until(()=>iframe.contentWindow?.NanpureAppTest);metrics.appStartupMs=+(performance.now()-t).toFixed(1);const w=iframe.contentWindow;
 t=performance.now();click(w,'[data-action="start"][data-flow="play"]');metrics.listDOMBuildMs=+(performance.now()-t).toFixed(1);if(w.document.querySelectorAll('[data-action="pick-play"]').length!==24)throw Error('Pagination mismatch');
 const pick=w.document.querySelector('[data-action="pick-play"]'),uid=pick.dataset.id;pick.click();await until(()=>w.document.querySelector('[data-action="begin-play"]'));click(w,'[data-action="begin-play"]');await until(()=>w.document.querySelector('#board [data-cell]'));const p=w.NanpureAppTest.getCurrent(),cell=p.puzzle.findIndex((v,i)=>!v&&!p.grid[i]);t=performance.now();click(w,'#board [data-cell="'+cell+'"]');click(w,'[data-action="number"][data-number="'+p.solution[cell]+'"]');await w.NPStorage.flush();metrics.inputAndPersistMs=+(performance.now()-t).toFixed(1);if((await w.NPStorage.get(uid)).grid[cell]!==p.solution[cell])throw Error('Input save mismatch');
 window.qa={status:'passed',metrics};document.querySelector('#results').textContent='PASS 10000 distinct generated puzzles, incremental durable saves, snapshot codec roundtrip, reopen, complete backup, 24-row catalog and real digit input';progress.textContent='成功：異なる1万問の実生成・保存・再起動・バックアップ・一覧・数字入力を確認';output.textContent=JSON.stringify({status:'passed',metrics},null,2);
 }catch(error){window.qa={status:'failed',errors:[error.stack||String(error)]};document.querySelector('#results').textContent=error.stack||String(error);progress.textContent='失敗';output.textContent=error.stack||String(error)}}document.querySelector('#run').onclick=run;
</script></body></html>
