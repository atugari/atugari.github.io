function clean(p,v){v=v&&typeof v==='object'?v:{};const allowed=new Set(edges(p).map(x=>x.join('-'))),walls=Array.isArray(v.walls)?[...new Set(v.walls.filter(k=>allowed.has(k)))]:[];return {puzzleRevision:p.revision||1,walls,joins:Array.isArray(v.joins)?[...new Set(v.joins.filter(k=>allowed.has(k)&&!walls.includes(k)))]:[],colors:Array.from({length:p.marks.length},(_,i)=>Array.isArray(v.colors)&&Number.isInteger(v.colors[i])&&v.colors[i]>=0&&v.colors[i]<=4?v.colors[i]:0)};}
function state(p){if(!data.games[p.id]||!data.games[p.id]._ready){const old=data.games[p.id]||{},s=clean(p,old);s.undo=(Array.isArray(old.undo)?old.undo:[]).slice(-100).map(v=>clean(p,v));Object.defineProperty(s,'_ready',{value:true});data.games[p.id]=s;}return data.games[p.id];}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));document.getElementById('save-notice').hidden=true;return true;}catch(e){document.getElementById('save-notice').hidden=false;return false;}}
function snapshot(s){s.undo.push({walls:s.walls.slice(),joins:s.joins.slice(),colors:s.colors.slice()});if(s.undo.length>100)s.undo.shift();}
function symbolValues(p){return Array.from({length:p.symbols||3},(_,i)=>i+1);}
function ruleMarks(p){return symbolValues(p).map(i=>marks[i]).join(' ');}
function valid(p,walls){const n=p.rows*p.cols,blocked=new Set(walls),adj=Array.from({length:n},()=>[]),owner=Array(n).fill(-1);for(const [a,b] of edges(p))if(!blocked.has(a+'-'+b)){adj[a].push(b);adj[b].push(a);}let num=0;for(let i=0;i<n;i++){if(owner[i]>=0)continue;const q=[i];owner[i]=num;for(let k=0;k<q.length;k++)for(const j of adj[q[k]])if(owner[j]<0){owner[j]=num;q.push(j);}if(q.length!==p.area||!symbolValues(p).every(v=>q.filter(j=>p.marks[j]===v).length===1))return false;num++;}return walls.every(k=>{const[a,b]=k.split('-').map(Number);return owner[a]!==owner[b];});}
