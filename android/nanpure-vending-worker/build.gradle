plugins {
    id 'com.android.application' version '8.6.1'
}

def workerEndpoint = providers.environmentVariable('NANPURE_REFILL_ENDPOINT')
    .orElse('https://nanpure-vending-pilot.puzzle-hub-4826.workers.dev/api/vending/worker').get()
if (!(workerEndpoint ==~ /https:\/\/[A-Za-z0-9.-]+(:[0-9]+)?\/api\/vending\/worker|http:\/\/(10\.0\.2\.2|127\.0\.0\.1|localhost):[0-9]+\/api\/vending\/worker/)) {
    throw new GradleException('Invalid refill endpoint.')
}

android {
    namespace 'jp.nanpure.refill'
    compileSdk 35

    defaultConfig {
        applicationId 'jp.nanpure.refill.fast'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.3.0'
        buildConfigField 'String', 'ENDPOINT', '"' + workerEndpoint + '"'
    }

    buildFeatures { buildConfig = true }
    sourceSets {
        main.assets.srcDir(layout.buildDirectory.dir('engine-assets'))
        main.assets.srcDir(layout.buildDirectory.dir('private-assets'))
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('prepareEngine', Exec) {
    def notebook = file('../../nanpure/releases/2026.11.04.95/notebook')
    def engine = layout.buildDirectory.file('engine-assets/engine.js')
    inputs.files(new File(notebook, 'index.html'), new File(notebook, 'batch.js'),
        file('prepare-engine.cjs'), file('engine-overrides/unique-solver.js'))
    outputs.files(engine, layout.buildDirectory.file('engine-assets/profiles.json'))
    commandLine 'node', file('prepare-engine.cjs'), engine.get().asFile
}
tasks.named('preBuild').configure { dependsOn('prepareEngine') }

def bootstrapPath = providers.environmentVariable('NANPURE_REFILL_BOOTSTRAP_FILE').orNull
tasks.register('preparePrivateBootstrap') {
    def target = layout.buildDirectory.file('private-assets/refill-bootstrap.json')
    inputs.property('configured', bootstrapPath != null)
    inputs.property('endpoint', workerEndpoint)
    if (bootstrapPath != null) inputs.file(file(bootstrapPath))
    outputs.dir(layout.buildDirectory.dir('private-assets'))
    doLast {
        def output = target.get().asFile
        delete(output)
        if (bootstrapPath != null) {
            def source = file(bootstrapPath)
            def data = new groovy.json.JsonSlurper().parse(source, 'UTF-8')
            if (data.format != 1 || data.endpoint != workerEndpoint ||
                    !(data.token instanceof String) || !(data.token ==~ /[a-f0-9]{64}/) ||
                    !data.keySet().every { it in ['format', 'endpoint', 'token', 'deviceId', 'name'] }) {
                throw new GradleException('Invalid private device bootstrap configuration.')
            }
            output.parentFile.mkdirs()
            output.setText(groovy.json.JsonOutput.toJson([
                format: 1, endpoint: data.endpoint, token: data.token
            ]) + '\n', 'UTF-8')
        }
    }
}
tasks.named('preBuild').configure { dependsOn('preparePrivateBootstrap') }
