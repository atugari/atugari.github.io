    }

    function escapeText(text) {
      return String(text).replace(/[&<>"']/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[character]));
    }

    function sectionMarkup(sections) {
      return sections.map(section => `<section class="sheet-section"><h3>${escapeText(section.label)}</h3><p>${escapeText(section.text)}</p></section>`).join("");
    }

    // 説明が一画面に入らなければ、文字を縮小せず続きのページを作る。
    function paginateSheet(anchorKey) {
      if (!infoSheet.open) return;
      const pages = [];
      for (const item of sheetItems) {
        $("#sheet-title").textContent = item.title;
        const fits = sections => {
          sheetBody.innerHTML = sectionMarkup(sections);
          return sheetBody.scrollHeight <= sheetBody.clientHeight + 1 && sheetBody.scrollWidth <= sheetBody.clientWidth + 1;
        };
        let pageSections = [];
        const flush = () => {
          if (pageSections.length) pages.push({ key: item.key, title: item.title, sections: pageSections });
          pageSections = [];
        };
        for (const section of item.sections) {
          if (fits([...pageSections, section])) {
            pageSections.push(section);
            continue;
          }
          flush();
          let characters = Array.from(section.text);
          while (characters.length) {
            const remaining = { label: section.label, text: characters.join("") };
            if (fits([remaining])) { pageSections.push(remaining); break; }
            let low = 1;
            let high = characters.length;
            let count = 1;
            while (low <= high) {
              const mid = Math.floor((low + high) / 2);
              if (fits([{ label: section.label, text: characters.slice(0, mid).join("") }])) {
                count = mid;
                low = mid + 1;
              } else { high = mid - 1; }
            }
            pageSections.push({ label: section.label, text: characters.slice(0, count).join("") });
            flush();
            characters = characters.slice(count);
          }
        }
        flush();
      }
      sheetPages = pages;
      sheetPageIndex = Math.max(0, pages.findIndex(page => page.key === anchorKey));
      renderSheetPage();
    }

    function renderSheetPage() {
      const page = sheetPages[sheetPageIndex];
      if (!page) return;
      $("#sheet-title").textContent = page.title;
      sheetBody.innerHTML = sectionMarkup(page.sections);
      $("#sheet-page").innerHTML = `<span>ページ</span><span>${sheetPageIndex + 1} / ${sheetPages.length}</span>`;
      const last = sheetPageIndex === sheetPages.length - 1;
      $("#sheet-prev").textContent = sheetSkipAction ? "スキップ" : "前へ";
      $("#sheet-prev").disabled = !sheetSkipAction && sheetPageIndex === 0;
      $("#sheet-next").textContent = last && sheetPrimaryAction ? sheetPrimaryLabel : "次へ";
      $("#sheet-next").disabled = last && !sheetPrimaryAction;
    }

    function showInfo(kind) {
      if (kind !== "help" && kind !== "score") return;
      const stage = currentStage();
      const area = AREAS.find(item => item.id === stage.areaId);
      const totalStages = area.stageIds.length;
      const areaName = area.name;
      let anchorKey;
      if (kind === "score") {
        const result = state.result[state.stageIndex];
        if (!result) return;
        sheetItems = result.breakdown.map((row, index) => ({ key: String(index), title: `${row.piece}の内訳`, sections: [
          { label: `${row.points > 0 ? "+" : ""}${row.points}点`, text: row.why }
        ] }));
        if (stage.usesAreaScores) sheetItems.unshift({ key: "growth-score", title: "現在の強さでの採点", sections: [
          { label: `${result.total}点 ／ 目標${result.target}点`, text: `今の強さで到達できる最高理論値は${result.theoretical}点です。${result.growthLimited
            ? "今の強さでは目標に届きません。光の庭・囲みの庭・ジャンケンの最高記録を伸ばして、石の加点を強くしましょう。"
            : result.cleared ? "目標達成です。ほかの配置やエリアの記録更新で、さらに高い得点を目指せます。" : "今の強さでも目標に届きます。石の配置を工夫してみましょう。"}` }
        ] });
      } else {
        sheetItems = [
          ...progressItems(),
          { key: "place", title: "遊び方", sections: [
            { label: `${areaName}は全${totalStages}面`, text: `全${totalStages}面のうち、現在は第${stage.number || stage.id}面です。上部のエリア欄と、その隣の面数欄から移動できます。` },
            { label: "石を置く・戻す", text: "石のボタンから空きマスへ、マウスでドラッグ＆ドロップ、または指で押したままスワイプして離すと配置できます。石を選んでから空きマスをタップしても置けます。置いた石をタップすると戻せます。" },
            { label: "説明を見ながら置く", text: "3種類の説明は、盤面と一緒に常に表示されています。説明カードをタップして石を選ぶか、カードから盤面へそのままドラッグして置けます。どの石を選んでも3種類すべての説明が見えます。" },
            { label: "動かす・入れ替える", text: "置いた石を指やマウスでドラッグして移動。別の石へ重ねると入れ替わります。「戻す」で一手前に戻せます。" }
          ] },
          { key: "effects", title: "盤面で効果を見る", sections: [
            { label: "配置すると、すぐ更新", text: "石の枠は緑が加点条件成立、赤の破線が減点、橙の二重線が加点と減点の両方または勝ち過ぎ、灰色の点線が条件待ち。石の数字は基礎点を含む、その石の現在の得点です。採点するまで合計点・理論値・記録は確定しません。" },
            { label: "光が届くマス", text: "光の通る空きマスが光ります。加点につながる範囲は緑、減点に関わる範囲は赤、相手がまだいない通り道は黄色。光源の光は最初の石で止まります。水色は見ている石が参照する範囲、紫は遮光に関わるマスです。" },
            { label: "囲みと勝敗もマスで確認", text: "同じ色の空きマスは一つの空間で、数字はその広さ。見ている石が触れる空間は明るくなります。ジャンケンは対戦関係にある石のマスが光り、勝つ側が緑、負ける側が赤、両方に関わる場合や勝ち過ぎは橙、あいこは灰色です。" },
            { label: "置く前にも確かめる", text: "ドラッグ中は配置予定の石と効果を仮表示します。置いた石の移動や入れ替えにも対応。盤外へ離すと元の表示へ戻ります。石が小さい画面では点数を縮めず、マスの発光・枠と採点欄の表示で確認できます。石にマウスを重ねるか押したままにすると、その石に関わるマスが明るくなります。" }
          ] },
          { key: "theme", title: "このステージ", sections: [
            { label: `${areaName}：全${totalStages}面 ／ 現在 第${stage.number || stage.id}面`, text: area.description },
            { label: stage.title, text: stage.description },
            { label: "採点", text: `目標は${stage.target}点。最大${stage.limit}個配置できます。未配置1枠につき−${stage.emptyPenalty}点。採点後に最高理論値と、一つずつの点数の内訳を確認できます。` }
          ] },
          ...(stage.usesAreaScores ? [{ key: "growth", title: "エリアの記録で石が育つ", sections: [
            { label: "10面の最高記録の合計", text: "光の庭・囲みの庭・ジャンケン、それぞれ10面の最高記録を合計します。未採点やマイナスの記録は0点。同じ面を何度採点しても増えず、最高記録を更新した分だけ合計が伸びます。集大成の得点は強さに加算されません。" },
            ...FINAL_TYPES.map(type => {
              const power = areaStrengths()[type.id];
              return { label: `${type.name}：合計${power.total}点`, text: `元のエリアを極めた合計は${power.maximum}点。現在の条件達成時の加点は+${power.bonus}。合計の達成割合×${type.maxExtra}を四捨五入し、初期加点${type.baseBonus}に足します。加点は+${type.baseBonus}〜+${type.baseBonus + type.maxExtra}です。` };
            }),
            { label: "加点が強まり、代償は一定", text: "強化されるのは各石の条件を満たしたときの加点です。基礎4点と接触などの減点は変わりません。元のエリアの最高記録を更新すると効果が変わり、集大成の採点表示を消します。配置は残るので、戻って採点し直してください。" },
            { label: "目標と最高理論値", text: "各面の目標点は固定です。最高理論値は今の3種類の強さに応じて変わり、採点後に表示します。理論値が目標に届かない場合は「要強化」と表示されます。先のエリアの記録を伸ばして再挑戦しましょう。" }
          ] }] : []),
          { key: "difficulty", title: "ステージの難易度", sections: [
            { label: `難易度 ☆${stage.difficulty} / 10`, text: "☆1（やさしい）〜☆10（とても難しい）の10段階。目標点に届くまでの目安です。上部の「エリア」でエリアを、その隣の「1面」などの欄でステージを選べます。各エリアは似たルールで☆1〜☆10を1面ずつ収録しています。" }
          ] },
          ...(stage.usesRooms ? [{ key: "rooms", title: "空間の数え方", sections: [
            { label: "空きマスをつなぐ", text: "石を置いていないマスを上下左右につなげると、一つの空間になります。曲がってつながっても同じ空間。斜めだけではつながりません。盤外と石のマスは数えません。" },
            { label: "同じ空間は一つ", text: "石が同じ空間に二方向から触れても、接する空間は一つ。同じ空間を複数の庭石で共有できます。離れた所に石を置いた結果、空間が分かれたり面積が変わることもあります。" },
            { label: "3種類とも壁になる", text: stage.usesAreaScores
              ? "光の庭・囲みの庭・ジャンケンの石は、すべて空間を区切る壁になります。囲みの石は、一つだけの空間に触れ、その広さが2か4マスのときに加点されます。二つ以上の空間に触れると−8点です。"
              : "仕切石・小庭石・大庭石のすべてが空間を区切ります。庭石を境界に置いて減点を受けても、他の石の加点で全体の得点が増える場合があります。" }
          ] }] : []),
          ...(stage.usesJanken ? [{ key: "janken", title: "ジャンケンの数え方", sections: [
            { label: "対戦する相手", text: "上下左右に隣り合う石すべてと対戦します。斜めと離れた石は相手になりません。グーはチョキに、チョキはパーに、パーはグーに勝ちます。あいこは勝敗に数えず、負けた石も残ります。" },
            { label: "1勝ボーナスと負けの代償", text: "石1個ごとに、1勝なら30点、2〜4勝なら12点、0勝なら0点。そこから1敗につき10点引きます。1勝1敗は20点、0勝1敗は−10点。勝ちすぎると1勝ボーナスを失います。" },
            { label: "同じ相手を分け合う", text: "一つの相手に複数の石が勝ってもかまいません。ただし、負ける側にも敗数分の減点があります。全員に勝ち相手を用意したいなら、勝ち負けのつながりをたどってみましょう。" }
          ] }] : []),
          { key: "hint", title: "考える順番", sections: [{ label: "ヒント", text: stage.note }] },
          { key: "save", title: "記録について", sections: [{ label: "最高記録", text: `この面の最高記録：${state.best[state.stageIndex] == null ? "未採点" : `${state.best[state.stageIndex]}点`}。記録はこのブラウザ内に保存されます。ステージを切り替えても配置は残りますが、ページを閉じると配置はリセットされます。` }] }
        ];
      }
      openSheet(kind, sheetItems);
    }

    function turnSheetPage(direction) {
      sheetPageIndex = Math.max(0, Math.min(sheetPages.length - 1, sheetPageIndex + direction));
      renderSheetPage();
    }

    function snapshot() { return currentBoard().slice(); }

    function pushHistory() {
      const history = state.histories[state.stageIndex];
      history.push(snapshot());
      if (history.length > 40) history.shift();
    }

    function moveCell(fromIndex, toIndex) {
      const board = currentBoard();
      if (!Number.isInteger(toIndex) || toIndex < 0 || toIndex >= board.length || !board[fromIndex] || fromIndex === toIndex) return;
      recordUniquePlayer('combination-blocks');
      pushHistory();
      [board[fromIndex], board[toIndex]] = [board[toIndex], board[fromIndex]];
      effectFocus = toIndex;
      effectHover = null;
      state.result[state.stageIndex] = null;
      render();
      boardCellAtIndex(toIndex)?.focus({ preventScroll: true });
    }

    function canPlaceType(typeId, index) {
      const stage = currentStage();
      const board = currentBoard();
      const type = typeById(stage, typeId);
      return Number.isInteger(index) && index >= 0 && index < board.length && !board[index] && !!type &&
        board.filter(Boolean).length < stage.limit && board.filter(id => id === typeId).length < type.max;
    }

    function placeStone(typeId, index) {
      if (!canPlaceType(typeId, index)) return false;
      recordUniquePlayer('combination-blocks');
      pushHistory();
      currentBoard()[index] = typeId;
      effectFocus = index;
      effectHover = null;
      state.selected[state.stageIndex] = typeId;
      state.result[state.stageIndex] = null;
      render();
      boardCellAtIndex(index)?.focus({ preventScroll: true });
      return true;
    }

    function toggleCell(index) {
      const board = currentBoard();
      if (!Number.isInteger(index) || index < 0 || index >= board.length) return;
      if (board[index]) {
        recordUniquePlayer('combination-blocks');
        pushHistory();
        board[index] = null;
        effectFocus = null;
        effectHover = null;
      } else {
        placeStone(state.selected[state.stageIndex], index);
        return;
      }
      state.result[state.stageIndex] = null;
      render();
    }

    function undo() {
      const history = state.histories[state.stageIndex];
      if (!history.length) return;
      state.boards[state.stageIndex] = history.pop();
      effectFocus = null;
      effectHover = null;
      state.result[state.stageIndex] = null;
      render();
    }

    function reset() {
      if (!currentBoard().some(Boolean)) return;
      pushHistory();
      state.boards[state.stageIndex] = Array(GRID_W * GRID_H).fill(null);
      effectFocus = null;
      effectHover = null;
      state.result[state.stageIndex] = null;
      render();
    }

    function check() {
      recordUniquePlayer('combination-blocks');
      const stage = currentStage();
      const before = campaignProgress(), wasTutorial = state.tutorial.active;
      const result = evaluate(stage, currentBoard());
      state.result[state.stageIndex] = result;
      if (state.best[state.stageIndex] == null || result.total > state.best[state.stageIndex]) {
        state.best[state.stageIndex] = result.total;
        if (!stage.usesAreaScores) {
          STAGES.forEach((member, index) => { if (member.usesAreaScores) state.result[index] = null; });
        }
        saveBest();
      }
      if (result.cleared) endTutorial(false);
      render();
      if (result.cleared && (!before.cleared[state.stageIndex] || wasTutorial)) showClearNotice(before);
    }

    function switchStage(index) {
      if (!isStageUnlocked(index)) { renderStageSelect(); return false; }
      cancelCellDrag();
      if (index !== state.stageIndex) endTutorial(false);
      state.stageIndex = index;
      effectFocus = null;
      effectHover = null;
      state.progress.lastStageId = currentStage().id;
      saveProgress();
      render();
      return true;
    }

    function render() {
      cancelCellDrag();
      renderAreaTheme();
      renderStageSelect();
      renderObjective();
      renderPalette();
      renderBoard();
      renderBoardEffects();
      announceBoardEffect();
      renderTutorial();
      scheduleBoardFit();
    }

    $("#undo-button").addEventListener("click", undo);
    $("#reset-button").addEventListener("click", reset);
    $("#check-button").addEventListener("click", check);
    stageSelect.addEventListener("change", event => switchStage(Number(event.target.value)));
    areaSelect.addEventListener("change", event => {
      const key = event.target.value;
      const index = state.areaStages[key] ?? STAGES.findIndex(stage => (stage.areaId) === key);
      switchStage(index);
    });
    $("#help-button").addEventListener("click", () => state.tutorial.active ? endTutorial() : showInfo("help"));
    $("#result-details-button").addEventListener("click", () => {
      if (state.result[state.stageIndex]) showInfo("score"); else showTutorialTip();
    });
    $("#sheet-tutorial").addEventListener("click", showTutorialIntro);
    $("#sheet-close").addEventListener("click", closeSheet);
    $("#sheet-prev").addEventListener("click", () => sheetSkipAction ? sheetSkipAction() : turnSheetPage(-1));
    $("#sheet-next").addEventListener("click", () => {
      if (sheetPageIndex === sheetPages.length - 1 && sheetPrimaryAction) sheetPrimaryAction();
      else turnSheetPage(1);
    });
    infoSheet.addEventListener("cancel", event => { event.preventDefault(); closeSheet(); });
    infoSheet.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
        event.preventDefault();
        turnSheetPage(event.key === "ArrowLeft" ? -1 : 1);
      }
    });
    window.addEventListener("resize", scheduleBoardFit, { passive: true });
    window.addEventListener("blur", cancelCellDrag);
    if (window.visualViewport && typeof window.visualViewport.addEventListener === "function") {
      window.visualViewport.addEventListener("resize", scheduleBoardFit, { passive: true });
    }
    if (typeof ResizeObserver === "function") {
      new ResizeObserver(scheduleBoardFit).observe(appElement);
    }
    if (document.fonts) document.fonts.ready.then(scheduleBoardFit);
    const savedStageIndex = STAGES.findIndex(stage => stage.id === state.progress.lastStageId);
    state.stageIndex = isStageUnlocked(savedStageIndex) ? savedStageIndex : Math.max(0, recommendStage());
    if (campaignProgress().cleared[0]) state.progress.tutorialSeen = true;
    render();
    if (!state.progress.tutorialSeen) showTutorialIntro();
  </script>
</body>
</html>
