<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f7f7f2"><title>パレあそび 利用状況</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f3;color:#26352e;font:14px/1.6 system-ui,-apple-system,"Noto Sans JP",sans-serif}main{max-width:1080px;margin:auto;padding:20px 16px 48px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}h1{font-size:23px;margin:0}h2{font-size:16px;margin:0 0 12px}.muted{color:#78827c;font-size:12px}.panel{background:white;border:1px solid #e1e6e0;border-radius:13px;padding:16px;margin:12px 0}.auth{max-width:440px;margin:12vh auto}.auth label{display:block;margin:12px 0 6px}input,select,button{font:inherit}input{width:100%;padding:12px;border:1px solid #cbd5cc;border-radius:8px}button{border:1px solid #cbd5cc;background:white;border-radius:8px;padding:9px 13px;min-height:40px;color:inherit;cursor:pointer}button.primary{background:#315d4c;color:white;border-color:#315d4c}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls button[aria-pressed=true]{background:#315d4c;color:white;border-color:#315d4c}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.metric{padding:13px;border:1px solid #e8ece7;border-radius:10px;min-width:0}.metric span{display:block;color:#68756d;font-size:12px}.metric strong{font-size:26px;font-variant-numeric:tabular-nums}.tables{display:grid;grid-template-columns:1fr 1fr;gap:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}th,td{text-align:left;padding:8px;border-bottom:1px solid #edf0ec}th{color:#68756d;font-weight:600}.bar{display:inline-block;height:8px;background:#6b9a7d;border-radius:8px;margin-right:6px;vertical-align:middle}.error{color:#a33}.hidden{display:none!important}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.small{font-size:11px;color:#77827a}@media(max-width:700px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.tables{grid-template-columns:1fr}main{padding:16px 12px 36px}.metric strong{font-size:23px}}
</style></head><body><main>
<header><div><h1>パレあそび 利用状況</h1><div class="muted">管理者専用・匿名集計</div></div><div class="controls"><a href="/plaza.html">パレあそびへ戻る</a></div></header>
<section id="login" class="panel auth"><h2>管理者認証</h2><p class="muted">既存の管理用キーを入力してください。キーはこのタブの間だけ保持します。</p><label for="key">管理用キー</label><input id="key" type="password" autocomplete="off" spellcheck="false"><div class="controls" style="margin-top:12px"><button id="loginBtn" class="primary">開く</button></div><p id="loginError" class="error" role="status"></p></section>
<div id="app" class="hidden">
<section class="panel"><div class="topline"><div class="controls" id="ranges"><button data-range="today">今日</button><button data-range="7d">7日</button><button data-range="30d" aria-pressed="true">30日</button><button data-range="90d">90日</button></div><div class="controls"><button id="refresh">更新</button><button id="logout">ログアウト</button></div></div><p id="updated" class="muted"></p></section>
<section class="cards" id="metrics"></section>
<section class="panel"><h2>日別の推移</h2><div id="daily" class="table-wrap"></div></section>
<div class="tables"><section class="panel"><h2>ゲーム別</h2><div id="games" class="table-wrap"></div></section><section class="panel"><h2>ゲーム内の画面別</h2><div id="screens" class="table-wrap"></div></section></div>
<section class="panel"><h2>広告の表示回数</h2><div id="ads" class="table-wrap"></div><p class="small">広告が実際に表示されたことを検知できた回数のみ。広告未導入・未表示の枠は0件です。</p></section>
<section class="panel"><h2>イベント内訳</h2><div id="events" class="table-wrap"></div></section>
<section class="panel"><p class="muted">利用者数は同じ日の同じブラウザーを1件とする匿名推計です。実人数ではありません。広告の表示回数は、広告枠の実表示を検知できたものだけを集計します。集計データは90日分を保持します。IPアドレス・入力内容・アカウント情報は記録しません。</p></section>
</div></main>
<script>
(()=>{'use strict';const API='https://puzzle-api.puzzle-hub-4826.workers.dev/api/pareasobi/analytics',names={plaza:'パレあそび',nanpure:'ナンプレ帳',shirupure:'シルプレ',wado:'和同開珎',crossword:'クロスワード',cross:'クロスてんびん',tenbin:'天秤',paths:'しるしのこみち',studio:'シルプレ工房',workshop:'パズルの試作室',maru:'丸場所記憶ゲーム',tobe:'飛べ飛',maze:'迷路ラボ',speed:'スピード',kuroshiro:'黒白',move:'Move Moove Mooove',memo:'ショッピング メモ',timer:'メータータイマー',skins:'きせかえギャラリー',combination:'Combine & Discover',narabe100:'ならべパズル100',echo:'エコーダイブ','magic-square':'魔方陣',other:'その他'};
const $=id=>document.getElementById(id),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let key=sessionStorage.getItem('pareAnalyticsKey')||'',range='30d';
const fmt=n=>(Number(n)||0).toLocaleString('ja-JP');function table(rows,cols){if(!rows.length)return'<p class="muted">まだ計測データがありません。</p>';return'<table><thead><tr>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(c[2](r))+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function metric(label,value){return'<div class="metric"><span>'+label+'</span><strong>'+fmt(value)+'</strong></div>'}
async function load(){if(!key)return;const r=await fetch(API+'?range='+range,{headers:{Authorization:'Bearer '+key},cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'読み込めませんでした。');$('app').classList.remove('hidden');$('login').classList.add('hidden');$('metrics').innerHTML=metric('アクセス数（ページ表示）',d.totals.pageViews)+metric('利用ブラウザー数',d.totals.visitors)+metric('プレイしたブラウザー（推計）',d.totals.players)+metric('プレイ開始',d.totals.starts)+metric('広告表示',d.totals.adImpressions)+metric('セッション数',d.totals.sessions)+metric('クリア',d.totals.completes)+metric('途中離脱',d.totals.abandons)+metric('記録イベント',d.totals.events);
$('daily').innerHTML=table(d.daily,[['day','日付',r=>r.day],['pageViews','アクセス',r=>fmt(r.pageViews)],['visitors','利用ブラウザー',r=>fmt(r.visitors)],['players','プレイしたブラウザー',r=>fmt(r.players)],['starts','開始',r=>fmt(r.starts)],['adImpressions','広告表示',r=>fmt(r.adImpressions)]]);
$('games').innerHTML=table(d.games,[['game','ゲーム',r=>names[r.game]||r.game],['pageViews','アクセス',r=>fmt(r.pageViews)],['visitors','利用ブラウザー',r=>fmt(r.visitors)],['players','プレイしたブラウザー',r=>fmt(r.players)],['starts','開始',r=>fmt(r.starts)],['adImpressions','広告',r=>fmt(r.adImpressions)]]);
$('screens').innerHTML=table(d.screens,[['game','ゲーム',r=>names[r.game]||r.game],['screen','画面',r=>r.screen],['views','表示回数',r=>fmt(r.views)],['visitors','利用ブラウザー',r=>fmt(r.visitors)]]);
$('ads').innerHTML=table(d.ads,[['game','ゲーム',r=>names[r.game]||r.game],['screen','画面',r=>r.screen],['page','ページ',r=>r.page],['impressions','表示回数',r=>fmt(r.impressions)],['visitors','利用ブラウザー',r=>fmt(r.visitors)]]);
$('events').innerHTML=table(d.events,[['event','イベント',r=>({page_view:'ページ表示',screen_view:'画面表示',game_start:'プレイ開始',game_complete:'クリア',game_abandon:'途中離脱',ad_impression:'広告表示'}[r.event]||r.event)],['count','回数',r=>fmt(r.count)]]);
$('updated').textContent='更新 '+new Date(d.generatedAt).toLocaleString('ja-JP')+' ／ '+d.from+' 〜 '+d.today+' ／ '+d.note}
$('loginBtn').onclick=async()=>{key=$('key').value.trim();try{await load();sessionStorage.setItem('pareAnalyticsKey',key);$('loginError').textContent=''}catch(e){$('loginError').textContent=e.message;key=''}};
$('key').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});$('refresh').onclick=()=>load().catch(e=>alert(e.message));$('logout').onclick=()=>{sessionStorage.removeItem('pareAnalyticsKey');key='';$('app').classList.add('hidden');$('login').classList.remove('hidden');$('key').value=''};
$('ranges').addEventListener('click',e=>{const b=e.target.closest('button[data-range]');if(!b)return;range=b.dataset.range;document.querySelectorAll('[data-range]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));load().catch(e=>alert(e.message))});
if(key)load().catch(()=>{sessionStorage.removeItem('pareAnalyticsKey');key=''});
})();
</script></body></html>
