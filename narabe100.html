<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ならべパズル</title>
<style>
:root{
  --wood:#3a2c22; --wood2:#2a2019; --tray:#17110d;
  --paper:#f1e9db; --paper2:#e2d7c3; --ink:#241f19;
  --shu:#c23b2c; --brass:#c0a06a; --sub:#a6957c; --line:#4d3c2e;
  --cell:70px; --gap:6px; --boardw:298px; --arrow:30px; --amg:5px;
  --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP","Songti SC",serif;
  --gothic:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
/* PC など ひろい がめん では ぜんたいを おおきく ひょうじ（スマホは そのまま） */
@media (min-width:820px) and (min-height:600px){ html{zoom:1.3} }
@media (min-width:1200px) and (min-height:800px){ html{zoom:1.55} }
@media (min-width:1700px) and (min-height:1000px){ html{zoom:1.8} }
body{
  color:var(--paper);font-family:var(--gothic);
  background:
    repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 1px,rgba(255,255,255,.02) 1px 3px,rgba(0,0,0,0) 3px 26px),
    radial-gradient(120% 80% at 50% 0%,#48372a 0%,var(--wood) 45%,var(--wood2) 100%);
  background-attachment:fixed;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 34px}

/* ---------- みだし ---------- */
.homelink{display:inline-block;font-size:11px;color:#d9cdb6;text-decoration:none;margin:0 0 10px;padding:4px 0;letter-spacing:.04em}
.homelink:active{color:var(--brass)}
.homelink.foot{margin-top:12px;border:1px solid var(--line);border-radius:3px;padding:8px 14px;color:#d9cdb6}
.head{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.head>div{min-width:0;flex:1}
.seal{width:52px;height:52px;flex:0 0 auto;border-radius:5px;background:var(--shu);
  color:#fff5ee;font-family:var(--mincho);font-size:30px;line-height:52px;text-align:center;
  transform:rotate(-3deg);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.head h1{margin:0;font-family:var(--mincho);font-size:clamp(17px,5.4vw,25px);font-weight:600;letter-spacing:.14em;white-space:nowrap}
.head p{margin:4px 0 0;font-size:11.5px;color:#d9cdb6;letter-spacing:.04em}
.headbtn{margin-left:auto;align-self:flex-start;flex:0 0 auto;font-size:11.5px;padding:7px 9px;white-space:nowrap;
  border-radius:3px;border:1px solid rgba(194,59,44,.6);color:var(--shu);
  background:linear-gradient(180deg,rgba(194,59,44,.16),rgba(194,59,44,.04))}
.headbtn.back{border-color:var(--line);color:var(--sub);background:none}
.headbtn:active{background:rgba(194,59,44,.3)}

/* ---------- ならびかた ---------- */
.colbar{display:flex;align-items:center;gap:5px;margin:0 0 8px;flex-wrap:wrap;
  background:rgba(0,0,0,.28);border:1px solid #6b5642;border-radius:4px;padding:8px 10px}
.colbar span{font-size:12px;color:#efe6d4;margin-right:auto;white-space:nowrap}
.colbar .btns{display:flex;gap:5px;margin-left:auto;flex:0 0 auto}
.colbtn{width:28px;height:26px;border-radius:3px;border:1px solid #8a7458;
  color:#f1e9db;font-size:12px;font-family:var(--mincho);background:rgba(0,0,0,.25)}
.colbtn.on{background:var(--brass);border-color:var(--brass);color:#2a2019}

/* ---------- 活字ケース風 ステージ一覧 ---------- */
#stagelist{display:grid;gap:8px}
.card{position:relative;display:flex;align-items:center;gap:9px;text-align:left;width:100%;
  padding:11px 10px;border-radius:3px;background:linear-gradient(180deg,#241a13,#1b140f);
  border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.card .glyph{flex:0 0 auto;opacity:.85}
.card .txt{min-width:0}
.card .no{font-family:var(--mincho);font-size:17px;line-height:1;color:var(--paper);white-space:nowrap}
.card .st{display:inline-block;margin-left:6px;font-size:9px;letter-spacing:.05em;vertical-align:2px;font-family:var(--gothic)}
.st.s1,.pstar.s1{color:#9fb3a0}.st.s2,.pstar.s2{color:#8fcf9a}.st.s3,.pstar.s3{color:#e6c35a}
.st.s4,.pstar.s4{color:#ef8a4a}.st.s5,.pstar.s5{color:#ff5a4a}
.pstar{font-size:11px;letter-spacing:.05em;align-self:center;margin-left:-4px}
.card .nm{font-size:11.5px;color:#cfc2aa;margin-top:5px;line-height:1.3;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.card.next{border-color:var(--brass)}
.card.next .no{color:var(--brass)}
.card.bonus{border-color:rgba(194,59,44,.55);background:linear-gradient(180deg,#2a1a16,#1e1310)}
.card.goal{border-color:rgba(110,207,143,.5)}
.card.goal .no{color:#6ecf8f}
.card.bonus .no{color:var(--shu)}
.pno.bonus{color:var(--shu)}
/* クリアずみ: ひだりの ふちが 朱、ばんごうに 朱の ✓ */
.card.done{border-left:4px solid var(--shu);background:linear-gradient(180deg,#2a1c14,#1f1610)}
.card.done .no::after{content:"\2713";display:inline-block;margin-left:5px;font-size:13px;font-weight:700;
  color:#fff;background:var(--shu);border-radius:50%;width:17px;height:17px;line-height:17px;text-align:center;
  vertical-align:2px;font-family:var(--gothic)}
.card.soon{opacity:.35}
.card.locked{opacity:.45;cursor:default}
.card.locked .no{color:#9c8a70}
.tierhd{grid-column:1 / -1;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:8px 0 0;padding:6px 2px 4px;
  border-bottom:1px solid #6b5642;color:#efe6d4;font-size:11.5px}
.tierhd .tno{font-family:var(--mincho);font-size:14px;color:var(--brass);letter-spacing:.1em}
.tierhd .trg{color:#cfc2aa}
.tierhd .tneed{margin-left:auto;font-size:10.5px;color:#cfc2aa}
.tierhd.locked .tno{color:#9c8a70}
.tierhd.locked .tneed{color:#e6c35a}
#clearTxt{white-space:pre-line}
/* れつが おおい とき: しるしを うえ、ばんごうを した に ならべて かさならない ように */
.c4 .nm,.c5 .nm{display:none}
.c2 .card{padding:10px 8px;gap:8px;align-items:flex-start}
.c2 .card .nm{font-size:11px}
.c3 .card{padding:9px 6px;gap:6px;align-items:flex-start}
.c3 .card .no{font-size:15px}
.c3 .card .nm{font-size:10px;margin-top:4px;-webkit-line-clamp:3}
.c3 .card .glyph svg{width:22px;height:22px}
.c4 .card,.c5 .card{flex-direction:column;justify-content:center;gap:5px;padding:9px 3px 8px}
.c4 .card .glyph,.c5 .card .glyph{margin:0}
.c4 .card .txt,.c5 .card .txt{text-align:center}
.c4 .card .no,.c5 .card .no{font-size:15px}
.c4 .card .st,.c5 .card .st{display:block;margin:4px 0 0;font-size:8px;letter-spacing:0}
.c3 .card .st{font-size:8px;margin-left:4px}
.c4 .card.done .no::after,.c5 .card.done .no::after{width:15px;height:15px;line-height:15px;font-size:11px;margin-left:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 12px;font-size:11px;color:#efe6d4}
.legend .lg{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.lgbox{display:inline-block;width:14px;height:14px;border-radius:2px;border:1.5px solid var(--brass);background:#241a13}
.lgbox.g{border-color:#6ecf8f}
.lgbox.d{border-color:var(--shu);border-left-width:4px}
.lgbox.b{border-color:rgba(194,59,44,.7);background:#2a1a16}
.mobar{display:flex;align-items:center;gap:6px;margin:0 0 12px;flex-wrap:wrap;
  background:rgba(0,0,0,.28);border:1px solid #6b5642;border-radius:4px;padding:8px 10px}
.mobar span{font-size:12px;color:#efe6d4;margin-right:auto;white-space:nowrap}
.mobar .btns{display:flex;gap:6px;margin-left:auto;flex:0 0 auto}
.mobar.center{justify-content:center;border:none;background:none;margin-top:12px;padding:0}
.mobar.center span{margin-right:4px}
.mobtn{width:auto;height:30px;padding:0 9px;display:inline-flex;align-items:center;gap:7px;font-size:12px}
.mprev{position:relative;display:inline-block;width:30px;height:13px;border-radius:2px;
  background:rgba(0,0,0,.4);overflow:hidden;flex:0 0 auto}
.mprev::after{content:"";position:absolute;left:1px;top:1px;width:11px;height:11px;border-radius:1px;
  background:var(--paper);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.mprev.snap::after{animation:pvSnap 5s steps(1,end) infinite}
.mprev.slide::after{animation:pvSlide 5s cubic-bezier(.3,.9,.3,1) infinite}
.mobtn.on .mprev{background:rgba(0,0,0,.28)}
.mobtn.on .mprev::after{background:#2a2019}
/* 5びょうに 1かい だけ うごいて、あとは とまっている */
@keyframes pvSnap{0%,10%{transform:translateX(0)}11%,22%{transform:translateX(17px)}23%,100%{transform:translateX(0)}}
@keyframes pvSlide{0%,8%{transform:translateX(0)}20%,26%{transform:translateX(17px)}38%,100%{transform:translateX(0)}}
.foot{margin-top:24px;text-align:center}
.mini{color:#7b6b57;font-size:11px;text-decoration:underline;text-underline-offset:3px}

/* ---------- プレイ ---------- */
.pbar{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.back{border:1px solid var(--line);border-radius:3px;padding:6px 10px;font-size:11.5px;
  color:var(--sub);flex:0 0 auto}
.pno{font-family:var(--mincho);font-size:24px;line-height:1;color:var(--brass)}
.pname{font-size:12.5px;color:var(--paper);min-width:0}
.hint{font-size:11.5px;line-height:1.5;color:var(--sub);margin:0 0 12px;
  padding-left:9px;border-left:2px solid var(--shu)}

#playarea{display:grid;justify-content:center;align-content:center;
  grid-template-columns:auto auto auto;grid-template-rows:auto auto auto;gap:var(--amg)}
#stripTop{grid-area:1/2/2/3}
#stripLeft{grid-area:2/1/3/2}
#board{grid-area:2/2/3/3}
#stripRight{grid-area:2/3/3/4}
#stripBottom{grid-area:3/2/4/3}
#cornerA{grid-area:1/1/2/2}
#cornerB{grid-area:1/3/2/4}
.corner{width:var(--arrow);height:var(--arrow);border:1px solid var(--line);border-radius:3px;
  color:var(--brass);font-size:14px;display:flex;align-items:center;justify-content:center;padding:0;
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.2))}
.corner:active{background:var(--brass);color:#241a13}
.astrip{display:grid;gap:var(--gap)}
#stripTop,#stripBottom{grid-template-columns:repeat(4,var(--cell))}
#stripLeft,#stripRight{grid-template-rows:repeat(4,var(--cell))}
.arrow{border:1px solid var(--line);border-radius:3px;color:var(--brass);font-size:14px;
  display:flex;align-items:center;justify-content:center;padding:0;
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.2))}
#stripTop .arrow,#stripBottom .arrow{width:var(--cell);height:var(--arrow)}
#stripLeft .arrow,#stripRight .arrow{width:var(--arrow);height:var(--cell)}
.arrow:active{background:var(--brass);color:#241a13}
.hidestrip{visibility:hidden}
.nostrip{display:none}

/* ばんめん＝活字を ならべる トレイ */
#board{position:relative;width:var(--boardw);height:var(--boardw);touch-action:none;
  background:var(--tray);border-radius:4px;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.06);
  outline:1px solid var(--line);outline-offset:2px}
.tile{position:absolute;width:var(--cell);height:var(--cell);border-radius:3px;
  background:linear-gradient(180deg,var(--paper) 0%,var(--paper2) 100%);
  color:var(--ink);display:flex;align-items:center;justify-content:center;
  font-family:var(--mincho);font-size:calc(var(--cell)*.44);font-weight:600;
  letter-spacing:.02em;pointer-events:none;
  text-shadow:0 1px 0 rgba(255,255,255,.8);
  box-shadow:0 2px 0 #a3917a,0 4px 7px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.9);
  transition:transform .13s cubic-bezier(.3,.9,.3,1),opacity .13s linear}
.rotbtn{position:absolute;width:32px;height:32px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#dcbd85,var(--brass));
  color:#241a13;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--tray);z-index:5;box-shadow:0 2px 4px rgba(0,0,0,.5)}
.rotbtn:active{transform:scale(.9)}
.pivot{position:absolute;width:var(--cell);height:var(--cell);border-radius:3px;z-index:5;
  border:2px dashed var(--brass);background:rgba(192,160,106,.1);
  color:var(--brass);font-size:11px;display:flex;align-items:flex-start;justify-content:flex-end;padding:2px}
.pivot:active{background:rgba(192,160,106,.3)}

.handle{border:1px solid rgba(192,160,106,.5);border-radius:3px;color:var(--brass);
  background:linear-gradient(180deg,rgba(192,160,106,.16),rgba(192,160,106,.04));
  font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;
  padding:0;touch-action:none}
#stripTop .handle,#stripBottom .handle{width:var(--cell);height:var(--arrow)}
#stripLeft .handle,#stripRight .handle{width:var(--arrow);height:var(--cell)}
.handle.on{background:var(--shu);border-color:var(--shu);color:#fff2ee}
.tile.off{display:none}
.corner.holder{background:linear-gradient(180deg,var(--paper),var(--paper2));color:var(--ink);
  font-family:var(--mincho);font-weight:600;font-size:13px;border-color:#a3917a;cursor:default}
.stone{position:absolute;width:var(--cell);height:var(--cell);border-radius:3px;z-index:1;
  background:radial-gradient(circle at 40% 35%,#5a4a3c,#2b221b 70%);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.7),inset 0 -1px 0 rgba(255,255,255,.06)}
.tribtn{position:absolute;width:22px;height:22px;border-radius:50%;z-index:5;padding:0;
  background:radial-gradient(circle at 35% 30%,#dcbd85,var(--brass));color:#241a13;font-size:10px;
  line-height:1;display:flex;align-items:center;justify-content:center;border:2px solid var(--tray);
  box-shadow:0 2px 4px rgba(0,0,0,.5)}
.tribtn:active{transform:scale(.9)}
.tribtn.s{background:radial-gradient(circle at 35% 30%,#e8867a,var(--shu));color:#fff2ee}
.portal{position:absolute;width:var(--cell);height:var(--cell);border-radius:3px;z-index:2;pointer-events:none;
  border:2px dashed var(--brass);color:var(--brass);font-size:12px;line-height:1;padding:2px;
  display:flex;align-items:flex-end;justify-content:flex-start;opacity:.9}
#board.wrapbg{outline:2px dashed var(--brass);outline-offset:3px}
#board.diagbg{background:repeating-linear-gradient(45deg,#1a130f 0 6px,var(--tray) 6px 14px)}
.wall{position:absolute;width:6px;border-radius:3px;z-index:3;pointer-events:none;
  background:linear-gradient(180deg,#d9b87e,var(--brass) 40%,#8a6d3f);box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.astrip.dim .arrow{opacity:.25}
.quadcross{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:2;
  background:linear-gradient(90deg,transparent calc(50% - 1px),rgba(194,59,44,.55) calc(50% - 1px),rgba(194,59,44,.55) calc(50% + 1px),transparent calc(50% + 1px)),
             linear-gradient(0deg,transparent calc(50% - 1px),rgba(194,59,44,.55) calc(50% - 1px),rgba(194,59,44,.55) calc(50% + 1px),transparent calc(50% + 1px))}
.centerlink{position:absolute;pointer-events:none;z-index:2;border:2px dashed rgba(192,160,106,.7);border-radius:4px;
  color:var(--brass);font-size:13px;line-height:1;padding:3px;display:flex;align-items:flex-start;justify-content:flex-end}
.rotbtn.edge{opacity:.92}
.tile .pt{position:absolute;right:4px;bottom:2px;font-style:normal;font-size:calc(var(--cell)*.2);color:var(--shu);line-height:1}
.rotbtn.dim,.arrow.dim{opacity:.22}
.rotbtn.stop{background:radial-gradient(circle at 35% 30%,#8d7a63,#5a4b3b);color:#f1e9db}
.rotbtn.deg{font-size:10px;font-weight:700;letter-spacing:-.02em}
.pivot{font-size:11px}
.pivot.dark{border-color:var(--shu);color:var(--shu);background:rgba(194,59,44,.1)}
.tile.val{font-size:calc(var(--cell)*.4)}
.tile.bump{animation:bump .22s ease-out}
@keyframes bump{0%{filter:brightness(1)}40%{filter:brightness(1.25)}100%{filter:brightness(1)}}
.tile.back{background:linear-gradient(180deg,#7a6753,#544435);color:transparent;
  box-shadow:0 2px 0 #3b2f25,0 4px 7px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18)}
.tile.glue{background:linear-gradient(180deg,#f6d9b8,#e7c193);font-size:calc(var(--cell)*.3);
  box-shadow:0 2px 0 #a8845a,0 4px 7px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.9)}
.tile.dom{width:calc(var(--cell)*2 + var(--gap));font-size:calc(var(--cell)*.36);gap:calc(var(--cell)*.22)}
.tile.dom span{position:relative}
.tile.dom span:first-child::after{content:"";position:absolute;right:calc(var(--cell)*-.13);top:15%;height:70%;
  border-right:1px dashed rgba(36,31,25,.35)}
#board.wrapbg2{outline:2px dashed var(--brass);outline-offset:3px}
.tile.mv{z-index:4;box-shadow:0 8px 16px rgba(0,0,0,.6),0 2px 0 #a3917a,inset 0 1px 0 rgba(255,255,255,.9);
  filter:brightness(1.07)}
#playarea.lock button{pointer-events:none}
.badmark{position:absolute;width:10px;height:10px;border-radius:50%;background:#e04a3a;z-index:2;pointer-events:none;
  box-shadow:0 0 0 2px rgba(241,233,219,.9)}
.qsum{position:absolute;width:28px;height:18px;border-radius:9px;z-index:4;pointer-events:none;
  background:#241a13;border:1px solid var(--line);color:var(--sub);font-family:var(--mincho);font-size:11px;
  display:flex;align-items:center;justify-content:center}
.qsum.ok{color:#6ecf8f;border-color:rgba(110,207,143,.6)}
.chainline{position:absolute;left:0;top:0;pointer-events:none;z-index:2}
.chainline line{stroke:#6ecf8f;stroke-width:5;stroke-linecap:round;opacity:.85}
.sumlbl{font-family:var(--mincho);font-size:13px;color:var(--sub);display:flex;align-items:center;justify-content:center}
.sumlbl.ok{color:#6ecf8f;border-color:rgba(110,207,143,.5)}
.corner.sumlbl{font-size:11px;cursor:default}
.kmark{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--shu);z-index:2;
  pointer-events:none;box-shadow:0 0 0 2px rgba(241,233,219,.9)}
.snakepath{position:absolute;left:0;top:0;pointer-events:none;opacity:.55}
.snakepath polyline{fill:none;stroke:var(--brass);stroke-width:3;stroke-dasharray:5 5;stroke-linejoin:round}
.diagmark{position:absolute;z-index:3;pointer-events:none;border-radius:4px;
  border:2px solid var(--shu);background:rgba(194,59,44,.14)}
.grabmark{position:absolute;z-index:3;pointer-events:none;border-radius:4px;
  border:2px solid var(--shu);background:rgba(194,59,44,.16)}
.frame{position:absolute;z-index:4;padding:0 5px;border:1px solid rgba(192,160,106,.45);
  background:linear-gradient(180deg,rgba(192,160,106,.16),rgba(192,160,106,.04));
  color:var(--brass);font-size:10px;line-height:1;display:flex;align-items:center;justify-content:flex-end}
.frame:active{background:rgba(192,160,106,.34)}
.ftop{border-radius:4px 4px 0 0;border-bottom:none}
.fbottom{border-radius:0 0 4px 4px;border-top:none}
.fleft,.fright{border-top:none;border-bottom:none}
.rotbtn.ccw{background:radial-gradient(circle at 35% 30%,#e0705f,var(--shu));color:#fff2ee}
.shotzone{position:absolute;left:-4px;right:-4px;border-top:1px dashed rgba(192,160,106,.55);
  background:linear-gradient(180deg,rgba(192,160,106,.12),rgba(192,160,106,0));
  pointer-events:none;border-radius:0 0 4px 4px}
.info{text-align:center;margin:14px 0 10px;font-size:11.5px;color:var(--sub);letter-spacing:.08em}
.info .phase{margin-left:14px;color:var(--shu);font-size:11px}
.info b{font-family:var(--mincho);font-size:16px;font-weight:600;color:var(--paper);margin-left:6px}

/* ---------- じょうたい ---------- */
let st=null, board=[], goal=[], tileEls={}, moves=0, cell=70, boardw=298;
const idx=(r,c)=>r*N+c;
const same=(a,b)=>a.every((v,i)=>v===b[i]);

/* ---------- うごかす ---------- */
function slideMove(v){
  const p=board.indexOf(v), b=board.indexOf(0);
  if(p<0||p===b) return false;
  const pr=(p/N)|0, pc=p%N, br=(b/N)|0, bc=b%N;
  if(pr!==br && pc!==bc) return false;
  if(pr===br){
    const d = pc<bc ? -1 : 1;
    for(let c=bc; c!==pc; c+=d) board[idx(br,c)]=board[idx(br,c+d)];
  }else{
    const d = pr<br ? -1 : 1;
    for(let r=br; r!==pr; r+=d) board[idx(r,bc)]=board[idx(r+d,bc)];
  }
  board[p]=0; return true;
}
function slideDist(v){
  const p=board.indexOf(v), b=board.indexOf(0);
  if(p<0||p===b) return 0;
  const pr=(p/N)|0, pc=p%N, br=(b/N)|0, bc=b%N;
  if(pr===br) return Math.abs(pc-bc);
  if(pc===bc) return Math.abs(pr-br);
  return 0;
}
function canSlide(v){
  if(v===STONE) return false;
  const d=slideDist(v);
  if(!d) return false;
  if(st.rule==='frozen'||st.rule==='pillar'){   /* とおりみちに いしが あれば だめ */
    const p=board.indexOf(v), b=board.indexOf(0);
    const pr=(p/N)|0,pc=p%N,br=(b/N)|0,bc=b%N;
    if(pr===br){ const lo=Math.min(pc,bc),hi=Math.max(pc,bc); for(let c=lo;c<=hi;c++) if(board[idx(pr,c)]===STONE) return false; }
    else{ const lo=Math.min(pr,br),hi=Math.max(pr,br); for(let r=lo;r<=hi;r++) if(board[idx(r,pc)]===STONE) return false; }
  }
  if(st.rule==='slide23') return d>=2;   /* 1まいだけは きんし */
  return true;
}
function shiftRow(r,d){
  const nb=board.slice();
  for(let c=0;c<N;c++) nb[idx(r,(c+d+N)%N)]=board[idx(r,c)];
  board=nb; return true;
}
function shiftCol(c,d){
  const nb=board.slice();
  for(let r=0;r<N;r++) nb[idx((r+d+N)%N,c)]=board[idx(r,c)];
  board=nb; return true;
}
function rot4(k,rr,cc){
  const [r,c] = (k<0) ? [rr,cc] : BLOCKS[k];
  const o=[idx(r,c),idx(r,c+1),idx(r+1,c+1),idx(r+1,c)];
  const nb=board.slice();
  for(let i=0;i<4;i++) nb[o[(i+1)%4]]=board[o[i]];
  board=nb; return true;
}
function ring8(k){
  const [r,c]=PIVOTS[k];
  const o=RING.map(([dr,dc])=>idx(r+dr,c+dc));
  const nb=board.slice();
  for(let i=0;i<8;i++) nb[o[(i+1)%8]]=board[o[i]];
  board=nb; return true;
}
/* したの だんを タップ: じぶん・うえ・ひだり・みぎが うちあがり、
   のこりが おちて、うちあがった ぶんが その れつの うえに つみなおされる。
   けっかは 「その れつを とんだ まいすう ぶん した へ まわす」と おなじ。 */
function shotCells(j){
  const cs=[idx(N-1,j),idx(N-2,j)];
  if(j>0) cs.push(idx(N-1,j-1));
  if(j<N-1) cs.push(idx(N-1,j+1));
  return cs;
}
function shotApply(j){
  shiftCol(j,2);
  if(j>0) shiftCol(j-1,1);
  if(j<N-1) shiftCol(j+1,1);
  return true;
}
/* そとがわ 12ますの わ（とけいまわり）と まんなか 4ますの はんとけいまわり */
const RING12=[[0,0],[0,1],[0,2],[0,3],[1,3],[2,3],[3,3],[3,2],[3,1],[3,0],[2,0],[1,0]];
function ring12(){
  const o=RING12.map(([r,c])=>idx(r,c));
  const nb=board.slice();
  for(let i=0;i<o.length;i++) nb[o[(i+1)%o.length]]=board[o[i]];
  board=nb; return true;
}
function centerCCW(){
  const o=[idx(1,1),idx(1,2),idx(2,2),idx(2,1)];
  const nb=board.slice();
  for(let i=0;i<4;i++) nb[o[(i+3)%4]]=board[o[i]];
  board=nb; return true;
}
/* つまみ: てまえから 3まいを つかみ、おなじ へんの べつの つまみと いれかえる */
function grabCells(side,i){
  if(side==='top')    return [0,1,2].map(r=>idx(r,i));
  if(side==='bottom') return [1,2,3].map(r=>idx(r,i));
  if(side==='left')   return [0,1,2].map(c=>idx(i,c));
  return [1,2,3].map(c=>idx(i,c));
}
function grabSwap(side,i,j){
  const A=grabCells(side,i), B=grabCells(side,j);
  for(let k=0;k<A.length;k++){ const t=board[A[k]]; board[A[k]]=board[B[k]]; board[B[k]]=t; }
  return true;
}

 /* ボタンは その ななめの えんちょうせん（1つ てまえ）に おく。

const ARCS=[
 [[0,0],[0,1],[0,2],[0,3],[1,3],[2,3],[3,3]],

/* とぶ あき: けいまの かたちに とぶ */

function insertOK(p,q){
  const pr=(p/N)|0,pc=p%N,qr=(q/N)|0,qc=q%N;
  if(pr===qr) return Math.abs(pc-qc)>=2;
  if(pc===qc) return Math.abs(pr-qr)>=2;

function insertMove(p,q){

  else{ const d=qr>pr?1:-1; for(let r=pr;r!==qr+d;r+=d) cells.push(idx(r,pc)); }

  for(let i=0;i<cells.length-1;i++) board[cells[i]]=board[cells[i+1]];

  if(st.rule==='diagSlide'){

  }else if(st.rule==='rookfar'){
    for(let k=0;k<N;k++){ if(Math.abs(k-bc)>=2) out.push(idx(br,k)); if(Math.abs(k-br)>=2) out.push(idx(k,bc)); }
  }else if(st.rule==='torusSlide'){
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>out.push(idx((br+dr+N)%N,(bc+dc+N)%N)));
  }else if(st.rule==='rook'){
    for(let k=0;k<N;k++){ if(k!==bc) out.push(idx(br,k)); if(k!==br) out.push(idx(k,bc)); }
  }else if(st.rule==='warp'){
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>push(br+dr,bc+dc));
    if(b===PORTAL2[0]) out.push(PORTAL2[1]); else if(b===PORTAL2[1]) out.push(PORTAL2[0]);

    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{
      const c2=bc+dc;

function shuffle(){
  board=goal.slice();
  const L=moveList();
  if(st.rule==='knight'){
    for(let i=0;i<st.scr;i++){ const t=knightTargets(); knightJump(t[(Math.random()*t.length)|0]); }
  }
  else if(st.rule==='mirror'){
    for(let i=0;i<st.scr;i++){ const m=mirrorPairs(); const [t,a]=m[(Math.random()*m.length)|0]; mirrorMove(t,a); }
  }
  else if(st.rule==='oddvert'){
    for(let i=0;i<st.scr;i++){
      const m=oddVertMoves(); if(!m.length) break;
      const [t,z]=m[(Math.random()*m.length)|0]; board[z]=board[t]; board[t]=0;
    }
  }
  else if(st.rule==='glue'){
    for(let i=0;i<st.scr;i++){ const m=glueMoves(); glueApply(m[(Math.random()*m.length)|0]); }
  }
  else if(st.rule==='domino'){
    for(let i=0;i<st.scr;i++){ const m=domAllMoves(); const [v,d]=m[(Math.random()*m.length)|0]; domMove(v,d); }
  }
  else if(st.rule==='warp'||st.rule==='torusSlide'||st.rule==='rook'){
    for(let i=0;i<st.scr;i++){ const t=blankTargets(); jumpIn(t[(Math.random()*t.length)|0]); }
  }
  else if(st.rule==='ptype'){
    for(let i=0;i<st.scr;i++){ const t=ptypeTargets(); ptypeJump(t[(Math.random()*t.length)|0]); }
  }
  else if(st.rule==='blankrot'){
    for(let i=0;i<st.scr;i++){ const ks=blankBlocks(); blockRot(ks[(Math.random()*ks.length)|0]); }
  }
  else if(st.rule==='blankline'){
    for(let i=0;i<st.scr;i++){
      const b=board.indexOf(0), br=(b/N)|0, bc=b%N, d=(Math.random()<.5)?1:-1;
      if(Math.random()<.5) shiftRow(br,d); else shiftCol(bc,d);
    }
  }
  else if(st.rule==='warpwall'||st.rule==='diagSlide'||st.rule==='rookfar'){
    for(let i=0;i<st.scr;i++){ const t=blankTargets(); jumpIn(t[(Math.random()*t.length)|0]); }
  }
  else if(st.rule==='torus23'){
    for(let i=0;i<st.scr;i++){ const m=torus23All(); const [kind,d,k]=m[(Math.random()*m.length)|0]; torus23Move(kind,d,k); }
  }
  else if(st.rule==='tempo'){
    tempoH=true;
    for(let i=0;i<st.scr;i++){
      const r=(Math.random()*N)|0, d=(Math.random()<.5)?1:-1;
      if(tempoH) shiftRow(r,d); else shiftCol(r,d);
      tempoH=!tempoH;
    }
  }
  else if(st.rule==='twin'){
    const D=[[0,1],[0,-1],[1,0],[-1,0]];
    for(let i=0;i<st.scr;i++){ const [dr,dc]=D[(Math.random()*4)|0]; twinMove(dr,dc); }
  }
  else if(st.rule==='near'||st.rule==='oddeven'){
    for(let i=0;i<st.scr;i++){ const m=allSwaps(); const [a,b]=m[(Math.random()*m.length)|0]; swapCells(a,b); }
  }
  else if(st.rule==='glide'){
    for(let i=0;i<st.scr;i++){ const m=allGlides(); const [p,dr,dc]=m[(Math.random()*m.length)|0]; glide(p,dr,dc); }
  }
  else if(L){ for(let i=0;i<st.scr;i++) L[(Math.random()*L.length)|0](); }
  else{
    for(let i=0;i<st.scr;i++){
      const b=board.indexOf(0), br=(b/N)|0, bc=b%N, cand=[];
      for(let c=0;c<N;c++) if(c!==bc) cand.push(board[idx(br,c)]);
      for(let r=0;r<N;r++) if(r!==br) cand.push(board[idx(r,bc)]);
      const ok=cand.filter(canSlide);
      slideMove(ok[(Math.random()*ok.length)|0]);
    }
  }
  if(isSolved()) shuffle();
}
function predBad(){
  /* ゴールが「ならび じゅん」でない ステージ: だめな ますの リスト（からなら クリア） */
  const bad=new Set();
  if(st.pred==='magic'){
    const line=(cells)=>cells.reduce((a,i)=>a+board[i],0);
    for(let r=0;r<N;r++){ const cs=[0,1,2,3].map(c=>idx(r,c)); if(line(cs)!==34) cs.forEach(i=>bad.add(i)); }
    for(let c=0;c<N;c++){ const cs=[0,1,2,3].map(r=>idx(r,c)); if(line(cs)!==34) cs.forEach(i=>bad.add(i)); }
    const d1=[0,1,2,3].map(i=>idx(i,i)), d2=[0,1,2,3].map(i=>idx(i,N-1-i));
    if(line(d1)!==34) d1.forEach(i=>bad.add(i));
    if(line(d2)!==34) d2.forEach(i=>bad.add(i));
  }
  if(st.pred==='chain'||st.pred==='apart'){
    const pos={}; board.forEach((v,i)=>{ if(v) pos[v]=i; });
    const nb=(a,b)=>Math.abs(((a/N)|0)-((b/N)|0))+Math.abs(a%N-b%N)===1;
    for(let k=1;k<16;k++){
      if(!(k in pos)||!((k+1) in pos)) continue;
      const near=nb(pos[k],pos[k+1]);
      if(st.pred==='chain' ? !near : near){ bad.add(pos[k]); bad.add(pos[k+1]); }
    }
  }
  if(st.pred==='parity'){
    for(let r=0;r<N;r++) for(let c=0;c<N;c++){
      const a=idx(r,c); if(!board[a]) continue;
      [[0,1],[1,0]].forEach(([dr,dc])=>{
        const rr=r+dr,cc=c+dc; if(rr>=N||cc>=N) return;
        const b=idx(rr,cc); if(!board[b]) return;
        if(board[a]%2===board[b]%2){ bad.add(a); bad.add(b); }
      });
    }
  }
  if(st.pred==='quad34'){
    for(let r=0;r<3;r++) for(let c=0;c<3;c++){
      const cs=[idx(r,c),idx(r,c+1),idx(r+1,c),idx(r+1,c+1)];
      if(cs.reduce((a,i)=>a+board[i],0)!==34) cs.forEach(i=>bad.add(i));
    }
  }
  if(st.pred==='far3'){
    for(let r=0;r<N;r++) for(let c=0;c<N;c++){
      const a=idx(r,c); if(!board[a]) continue;
      [[0,1],[1,0]].forEach(([dr,dc])=>{
        const rr=r+dr,cc=c+dc; if(rr>=N||cc>=N) return;
        const b=idx(rr,cc); if(!board[b]) return;
        if(Math.abs(board[a]-board[b])<3){ bad.add(a); bad.add(b); }
      });
    }
  }
  if(st.pred==='pair17'){
    const pos={}; board.forEach((v,i)=>{ if(v) pos[v]=i; });
    const nb=(a,b)=>Math.abs(((a/N)|0)-((b/N)|0))+Math.abs(a%N-b%N)===1;
    for(let k=1;k<=8;k++){ if(!nb(pos[k],pos[17-k])){ bad.add(pos[k]); bad.add(pos[17-k]); } }
  }
  if(st.pred==='two2'){
    for(let r=0;r<N;r++){ const cs=[0,1,2,3].map(c=>idx(r,c)); const odd=cs.filter(i=>board[i]&&board[i]%2===1).length, ev=cs.filter(i=>board[i]&&board[i]%2===0).length; if(odd!==2||ev>2) cs.forEach(i=>{ if(board[i]) bad.add(i); }); }
    for(let c=0;c<N;c++){ const cs=[0,1,2,3].map(r=>idx(r,c)); const odd=cs.filter(i=>board[i]&&board[i]%2===1).length, ev=cs.filter(i=>board[i]&&board[i]%2===0).length; if(odd!==2||ev>2) cs.forEach(i=>{ if(board[i]) bad.add(i); }); }
  }
  if(st.pred==='young'){
    for(let r=0;r<N;r++){ const row=[0,1,2,3].map(c=>idx(r,c)).filter(i=>board[i]);
      for(let i=1;i<row.length;i++) if(board[row[i-1]]>board[row[i]]){ bad.add(row[i-1]); bad.add(row[i]); } }
    for(let c=0;c<N;c++){ const col=[0,1,2,3].map(r=>idx(r,c)).filter(i=>board[i]);
      for(let i=1;i<col.length;i++) if(board[col[i-1]]>board[col[i]]){ bad.add(col[i-1]); bad.add(col[i]); } }
  }
  return bad;
}
function isSolved(){
  if(st.pred) return predBad().size===0;
  return same(board,goal) && (st.rule!=='push' || outside===EXTRA);
}

    const pos={}; board.forEach((v,i)=>{ if(v) pos[v]=i; });
    const ns='http://www.w3.org/2000/svg';
    const svg=document.createElementNS(ns,'svg'); svg.setAttribute('class','chainline');
    svg.setAttribute('viewBox','0 0 '+boardw+' '+boardw); svg.setAttribute('width',boardw); svg.setAttribute('height',boardw);
    for(let k=1;k<=8;k++){
      const a=pos[k], b=pos[17-k];
      if(Math.abs(((a/N)|0)-((b/N)|0))+Math.abs(a%N-b%N)!==1) continue;
      const l=document.createElementNS(ns,'line');
      l.setAttribute('x1',(a%N)*u+cell/2); l.setAttribute('y1',((a/N)|0)*u+cell/2);
      l.setAttribute('x2',(b%N)*u+cell/2); l.setAttribute('y2',((b/N)|0)*u+cell/2);
      svg.appendChild(l);
    }
    bd.appendChild(svg);
    return;
  }
  if(st.pred==='quad34'){
    document.querySelectorAll('.qsum').forEach(d=>d.remove());
    for(let r=0;r<3;r++) for(let c=0;c<3;c++){
      const v=board[idx(r,c)]+board[idx(r,c+1)]+board[idx(r+1,c)]+board[idx(r+1,c+1)];
      const d=document.createElement('div'); d.className='qsum'+(v===34?' ok':''); d.textContent=v;
      d.style.left=((c+1)*u-GAP/2-14)+'px'; d.style.top=((r+1)*u-GAP/2-9)+'px';
      bd.appendChild(d);
    }
    return;
  }
  if(st.pred==='chain'){
    const pos={}; board.forEach((v,i)=>{ if(v) pos[v]=i; });
    const ns='http://www.w3.org/2000/svg';
    const svg=document.createElementNS(ns,'svg'); svg.setAttribute('class','chainline');
    svg.setAttribute('viewBox','0 0 '+boardw+' '+boardw); svg.setAttribute('width',boardw); svg.setAttribute('height',boardw);
    for(let k=1;k<16;k++){
      const a=pos[k], b=pos[k+1];
      if(Math.abs(((a/N)|0)-((b/N)|0))+Math.abs(a%N-b%N)!==1) continue;
      const l=document.createElementNS(ns,'line');
      l.setAttribute('x1',(a%N)*u+cell/2); l.setAttribute('y1',((a/N)|0)*u+cell/2);
      l.setAttribute('x2',(b%N)*u+cell/2); l.setAttribute('y2',((b/N)|0)*u+cell/2);
      svg.appendChild(l);
    }
    bd.appendChild(svg);
    return;
  }
  predBad().forEach(i=>{
    const d=document.createElement('div'); d.className='badmark';
    d.style.left=((i%N)*u+cell-14)+'px'; d.style.top=(((i/N)|0)*u+4)+'px';
    bd.appendChild(d);
  });
  if(st.pred==='magic') magicSums();
}
function magicSums(){
  const line=(cells)=>cells.reduce((a,i)=>a+board[i],0);
  document.querySelectorAll('#stripRight .sumlbl').forEach((el,r)=>{ const v=line([0,1,2,3].map(c=>idx(r,c))); el.textContent=v; el.classList.toggle('ok',v===34); });
  document.querySelectorAll('#stripBottom .sumlbl').forEach((el,c)=>{ const v=line([0,1,2,3].map(r=>idx(r,c))); el.textContent=v; el.classList.toggle('ok',v===34); });
  const d1=line([0,1,2,3].map(i=>idx(i,i))), d2=line([0,1,2,3].map(i=>idx(i,N-1-i)));
  const a=$('#cornerA'), b=$('#cornerB');
  a.textContent=d1; a.classList.toggle('ok',d1===34);
  b.textContent=d2; b.classList.toggle('ok',d2===34);
}

/* ---------- おおきさ（どの がめんひでも はいるように） ---------- */
function layout(){
  const arrows=(st.rule==='torus'||st.rule==='torusRD'||st.rule==='shotRow'||st.rule==='grab'||st.rule==='diag'||st.rule==='fan'||st.rule==='gear'||st.rule==='snake'||st.rule==='push'||st.rule==='lineswap'||st.rule==='transpose'||st.rule==='spin'||st.rule==='loop3'||st.rule==='tempo'||st.rule==='linkall'||st.rule==='blankline'||st.rule==='zigzag'||st.rule==='spiral'||st.rule==='twinline'||st.rule==='twistrow'||st.rule==='wrapline'||st.rule==='revonly'||st.rule==='cornerrot'||st.rule==='endswap'||st.rule==='speedrow'||st.rule==='backrow'||st.rule==='skipswap'||st.rule==='antitr'||st.rule==='halfshift'||st.rule==='phase'||st.rule==='movebtn'||st.rule==='cascade'||st.rule==='rowflip'||st.rule==='shiftskip'||st.rule==='skipline'||st.rule==='twoloop'||st.rule==='midrev'||st.rule==='twistshift'||st.rule==='rowskip'||st.rule==='mirrorloop'
    ||st.rule==='rowtr'||st.rule==='vloop2'||st.rule==='nextrev'||st.rule==='midpush'||st.rule==='rot180'||st.pred==='magic'||st.rule==='addline'
    ||(GENERIC[st.rule]&&GENERIC[st.rule].rows));
  const wrap=document.querySelector('.wrap');
  const cs=getComputedStyle(wrap);
  const contentW=wrap.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const side=arrows?2*(ARROW+AMG):((st.rule==='ring12'||st.rule==='clock2'||st.rule==='wrap2x2'||st.rule==='ringrev')?2*(15+AMG):2*AMG);
  const availW=contentW-side;
  const pa=$('#playarea');
  let topY=pa.getBoundingClientRect().top;
  if(!(topY>0)) topY=180;
  const availH=window.innerHeight-topY-100-side;
  let w=Math.min(420,availW);
  if(availH>140) w=Math.min(w,availH);
  w=Math.max(140,w);
  cell=Math.floor((w-GAP*(N-1))/N);
  boardw=cell*N+GAP*(N-1);
  const rs=document.documentElement.style;
  rs.setProperty('--cell',cell+'px');
  rs.setProperty('--gap',GAP+'px');
  rs.setProperty('--boardw',boardw+'px');
  rs.setProperty('--arrow',ARROW+'px');
  rs.setProperty('--amg',AMG+'px');
}

    list.forEach(o=>{

/* つまみの えらび・いれかえ */
let sel=null;
function grabMark(){
  const old=document.querySelector('.grabmark'); if(old) old.remove();
  document.querySelectorAll('.handle').forEach(h=>h.classList.remove('on'));
  if(!sel) return;
  const h=document.querySelector('.handle[data-side="'+sel.side+'"][data-i="'+sel.i+'"]');
  if(h) h.classList.add('on');
  const d=document.createElement('div'); d.className='grabmark';
  const L3=cell*3+GAP*2, u=cell+GAP;
  if(sel.side==='top'||sel.side==='bottom'){
    d.style.left=(sel.i*u)+'px'; d.style.width=cell+'px';
    d.style.top=(sel.side==='top'?0:u)+'px'; d.style.height=L3+'px';
  }else{
    d.style.top=(sel.i*u)+'px'; d.style.height=cell+'px';
    d.style.left=(sel.side==='left'?0:u)+'px'; d.style.width=L3+'px';
  }
  $('#board').appendChild(d);
}
function handleUp(side,i,e){
  const el=document.elementFromPoint(e.clientX,e.clientY);
  let tside=side,ti=i;
  if(el&&el.classList.contains('handle')){ tside=el.dataset.side; ti=+el.dataset.i; }
  if(tside===side && ti!==i){ grabSwap(side,i,ti); sel=null; grabMark(); after(); return; }
  if(sel && sel.side===side && sel.i!==i){ grabSwap(side,sel.i,i); sel=null; grabMark(); after(); return; }
  sel=(sel&&sel.side===side&&sel.i===i)?null:{side,i};
  grabMark();
}
function buildArrows(){
  const ids=['stripTop','stripBottom','stripLeft','stripRight'];

      el.setAttribute('aria-label','ななめの ごうけい'); el.onclick=null;

      el.setAttribute('aria-label','ばんを ななめに おりかえす');

      el.setAttribute('aria-label','ばんを ななめに おりかえす');
      el.onclick=()=>{ transposeBoard(); after(); };
      return;
    }
    if(st.rule==='spin'){
      el.classList.remove('nostrip');
      const d=(cid==='cornerB')?1:-1;

    if(st.rule==='spiral'){

        el.appendChild(b);
      }
      return;
    }
    if(st.rule==='zigzag'){
      const sd=SIDE[id];
      for(let i=0;i<N;i++){
        const b=document.createElement('button'); b.className='arrow';
        const kind=(sd==='left'||sd==='right')?'row':'col';
        const d=(sd==='right'||sd==='bottom')?1:-1;
        b.textContent={top:'\u2191',bottom:'\u2193',left:'\u2190',right:'\u2192'}[sd];
        b.setAttribute('aria-label','この れつと となりを うごかす');
        const cells=zigCells(kind,i);
        b.addEventListener('pointerdown',()=>cellsMark(cells,true));
        b.addEventListener('pointerup',()=>cellsMark(cells,false));
        b.addEventListener('pointerleave',()=>cellsMark(cells,false));
        b.addEventListener('click',()=>{ (kind==='col')?zigCol(i,d):zigRow(i,d); cellsMark(cells,false); after(); });
        el.appendChild(b);
      }
      return;
    }
    if(st.rule==='linkall'||st.rule==='blankline'){
      const link=(st.rule==='linkall');
      for(let i=0;i<N;i++){
        const b=document.createElement('button'); b.className='arrow';
        const R=(d)=>()=>{ if(b.disabled) return; if(link) runSteps([()=>shiftRow(i,d),()=>{for(let c=0;c<N;c++) shiftCol(c,1);}]); else { shiftRow(i,d); after(); } };
        const C=(d)=>()=>{ if(b.disabled) return; if(link) runSteps([()=>shiftCol(i,d),()=>{for(let r=0;r<N;r++) shiftRow(r,1);}]); else { shiftCol(i,d); after(); } };
        if(id==='stripTop'){ b.textContent='\u2191'; b.onclick=C(-1); }
        if(id==='stripBottom'){ b.textContent='\u2193'; b.onclick=C(1); }
        if(id==='stripLeft'){ b.textContent='\u2190'; b.onclick=R(-1); }
        if(id==='stripRight'){ b.textContent='\u2192'; b.onclick=R(1); }
        el.appendChild(b);
      }
      return;
    }
    if(st.rule==='tempo'){
      for(let i=0;i<N;i++){
        const b=document.createElement('button'); b.className='arrow';
        const go=(fn)=>{ if(busy) return; fn(); tempoH=!tempoH; tempoRefresh(); after(); };
        if(id==='stripTop'){ b.textContent='\u2191'; b.onclick=()=>{ if(!tempoH) go(()=>shiftCol(i,-1)); }; }
        if(id==='stripBottom'){ b.textContent='\u2193'; b.onclick=()=>{ if(!tempoH) go(()=>shiftCol(i,1)); }; }
        if(id==='stripLeft'){ b.textContent='\u2190'; b.onclick=()=>{ if(tempoH) go(()=>shiftRow(i,-1)); }; }
        if(id==='stripRight'){ b.textContent='\u2192'; b.onclick=()=>{ if(tempoH) go(()=>shiftRow(i,1)); }; }
        el.appendChild(b);
      }
      return;
    }
    if(st.rule==='push'){
      const sd=SIDE[id];
      for(let i=0;i<N;i++){
        const b=document.createElement('button'); b.className='arrow';
        if(sd==='top'){ b.textContent='\u2193'; b.onclick=()=>{pushLine('col',i,1);after();}; }
        if(sd==='bottom'){ b.textContent='\u2191'; b.onclick=()=>{pushLine('col',i,-1);after();}; }
        if(sd==='left'){ b.textContent='\u2192'; b.onclick=()=>{pushLine('row',i,1);after();}; }
        if(sd==='right'){ b.textContent='\u2190'; b.onclick=()=>{pushLine('row',i,-1);after();}; }
        b.setAttribute('aria-label','ここから おしこむ');
        el.appendChild(b);
      }
      return;
    }
    if(st.rule==='lineswap'){
      const sd=SIDE[id];
      if(sd==='bottom'||sd==='right'){ el.classList.add('hidestrip'); for(let i=0;i<N;i++){const b=document.createElement('button');b.className='handle';el.appendChild(b);} return; }
      const kind=(sd==='left')?'row':'col';
      for(let i=0;i<N;i++){
        const b=document.createElement('button');
        b.className='handle'; b.dataset.kind=kind; b.dataset.i=i;
        b.textContent=(kind==='row')?'\u2261':'\u2980';
        b.setAttribute('aria-label',kind==='row'?'この ぎょうを えらぶ':'この れつを えらぶ');
        b.addEventListener('pointerdown',ev=>{ev.preventDefault();});
        b.addEventListener('pointerup',ev=>lineUp(kind,i,ev));
        el.appendChild(b);
      }
      return;
    }
    if(st.rule==='gear'){
      const sd=SIDE[id];
      for(let i=0;i<N;i++){
        const b=document.createElement('button'); b.className='arrow';
        const GC=(d)=>()=>runSteps([()=>shiftCol(i,d),()=>{ if(i>0) shiftCol(i-1,-d); if(i<N-1) shiftCol(i+1,-d); }]);
        const GR=(d)=>()=>runSteps([()=>shiftRow(i,d),()=>{ if(i>0) shiftRow(i-1,-d); if(i<N-1) shiftRow(i+1,-d); }]);
        if(sd==='top'){ b.textContent='\u2191'; b.onclick=GC(-1); }
        if(sd==='bottom'){ b.textContent='\u2193'; b.onclick=GC(1); }
        if(sd==='left'){ b.textContent='\u2190'; b.onclick=GR(-1); }
        if(sd==='right'){ b.textContent='\u2192'; b.onclick=GR(1); }
        el.appendChild(b);
      }
      return;
    }
    if(st.rule==='snake'){
      const sd=SIDE[id];
      if(sd==='top'||sd==='bottom'){ el.classList.add('nostrip'); return; }
      for(let i=0;i<N;i++){
        const b=document.createElement('button'); b.className='arrow';
        if(i===0){
          b.textContent=(sd==='left')?'\u2190':'\u2192';
          b.setAttribute('aria-label','いちばん うえの だんを うごかす');
          b.onclick=()=>{ shiftRow(0, sd==='left'?-1:1); after(); };
        }else b.style.visibility='hidden';
        el.appendChild(b);
      }
      return;
    }
    if(st.rule==='fan'){
      const sd=SIDE[id];
      if(sd==='top'||sd==='bottom'){ el.classList.add('nostrip'); return; }
      for(let i=0;i<N;i++){
        const b=document.createElement('button'); b.className='arrow';
        if(sd==='left'&&i<ARCS.length){
          const k=i;
          b.textContent='\u21b7';
          b.setAttribute('aria-label','この おうぎを ながす');
          b.addEventListener('pointerdown',()=>fanMark(k,true));
          b.addEventListener('pointerup',()=>fanMark(k,false));
          b.addEventListener('pointercancel',()=>fanMark(k,false));
          b.addEventListener('pointerleave',()=>fanMark(k,false));
          b.addEventListener('click',()=>{ fanMove(k); fanMark(k,false); after(); });
        }else if(i===N-1){
          b.textContent=(sd==='left')?'\u2190':'\u2192';
          b.setAttribute('aria-label','いちばん したの だんを うごかす');
          b.onclick=()=>{ shiftRow(N-1, sd==='left'?-1:1); after(); };
        }else{ b.style.visibility='hidden'; }
        el.appendChild(b);
      }
      return;
    }
    if(st.rule==='diag'){
      const sd=SIDE[id];
      if(sd==='bottom'){ el.classList.add('nostrip'); return; }
      for(let i=0;i<N;i++){
        const k=DIAGS.findIndex(d=>d.side===sd&&d.i===i);
        const b=document.createElement('button'); b.className='arrow';
        if(k<0){ b.style.visibility='hidden'; }
        else{
          b.textContent=DIAGS[k].mark;
          b.setAttribute('aria-label','この ななめを ずらす');
          b.addEventListener('pointerdown',()=>diagMark(k,true));
          b.addEventListener('pointerup',()=>diagMark(k,false));
          b.addEventListener('pointercancel',()=>diagMark(k,false));
          b.addEventListener('pointerleave',()=>diagMark(k,false));
          b.addEventListener('click',()=>{ diagMove(k); diagMark(k,false); after(); });
        }
        el.appendChild(b);
      }
      return;
    }
    if(st.rule==='grab'){
      const sd=SIDE[id];
      for(let i=0;i<N;i++){
        const b=document.createElement('button');
        b.className='handle'; b.dataset.side=sd; b.dataset.i=i;
        b.textContent=(sd==='top'||sd==='bottom')?'⋮':'⋯';
        b.setAttribute('aria-label','ここから 3まいを つかむ');
        b.addEventListener('pointerdown',ev=>{ev.preventDefault();});
        b.addEventListener('pointerup',ev=>handleUp(sd,i,ev));
        el.appendChild(b);
      }
      return;
    }
    if(rowOnly){
      if(id==='stripTop'||id==='stripBottom'){ el.classList.add('nostrip'); return; }
      for(let i=0;i<N;i++){
        const b=document.createElement('button'); b.className='arrow';
        if(i<N-1){ b.style.visibility='hidden'; }
        else{
          b.textContent = (id==='stripLeft') ? '←' : '→';
          b.onclick=()=>{ if(busy) return; shiftRow(N-1, id==='stripLeft'?-1:1); after(); };
        }
        el.appendChild(b);
      }
      return;
    }
    if(!arrows){ el.classList.add('nostrip'); return; }
    if(st.rule==='torusRD'&&(id==='stripTop'||id==='stripLeft')) el.classList.add('hidestrip');
    for(let i=0;i<N;i++){
      const b=document.createElement('button'); b.className='arrow';
      if(id==='stripTop'){ b.textContent='↑'; b.onclick=()=>{shiftCol(i,-1);after();}; }
      if(id==='stripBottom'){ b.textContent='↓'; b.onclick=()=>{shiftCol(i,1);after();}; }
      if(id==='stripLeft'){ b.textContent='←'; b.onclick=()=>{shiftRow(i,-1);after();}; }
      if(id==='stripRight'){ b.textContent='→'; b.onclick=()=>{shiftRow(i,1);after();}; }
      el.appendChild(b);
    }
  });
}
function placeTile(v,dy){
  const p=board.indexOf(v), r=(p/N)|0, c=p%N;
  if(st.rule==='glue'&&v===GLUE){
    const el=tileEls[v], h=!glueHoriz();
    el.style.width = h ? 'var(--cell)' : 'calc(var(--cell)*2 + var(--gap))';
    el.style.height= h ? 'calc(var(--cell)*2 + var(--gap))' : 'var(--cell)';
  }
  tileEls[v].style.transform=`translate(${c*(cell+GAP)}px,${r*(cell+GAP)+(dy||0)}px)`;
}
function render(anim){
  if(st.add){
    for(let i=0;i<16;i++){
      const el=tileEls[i]; if(!el) continue;
      if(el.textContent!==String(board[i])){ el.textContent=board[i]; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
    }
    lastBoard=board.slice();
    return;
  }
  const dur=moveDur();
  const moved=[], wrapped=[];
  cancelFly();
  if(anim!==false && lastBoard.length) st.tiles.forEach(v=>{
    const a=lastBoard.indexOf(v), b=board.indexOf(v);
    if(a<0||b<0||a===b) return;
    if(isWrapMove((a/N)|0,a%N,(b/N)|0,b%N)) wrapped.push([v,a,b]);
    else moved.push(v);
  });
  const lift=(motion==='on')&&SLOW_RULES.has(st.rule);
  moved.forEach(v=>{ const el=tileEls[v]; el.style.transitionDuration=dur+'ms'; if(lift) el.classList.add('mv'); });
  if(moved.length) setTimeout(()=>moved.forEach(v=>{ tileEls[v].classList.remove('mv'); tileEls[v].style.transitionDuration=''; }),dur+60);
  lastBoard=board.slice();
  if(st.rule==='push'){
    st.tiles.forEach(v=>{
      const el=tileEls[v];
      if(v===outside){ el.classList.add('off'); }
      else{ el.classList.remove('off'); placeTile(v,0); }
    });
    $('#cornerA').textContent=(outside===EXTRA)?'\u25c6':outside;
    return;
  }
  st.tiles.forEach(v=>placeTile(v,0));
  wrapped.forEach(([v,a,b])=>wrapFly(v,a,b));
  if(st.rule==='blankrot') blankRotRefresh();
  if(st.rule==='blankline') blankLineRefresh();
  predMark();
  if(st.rule==='knight'||st.rule==='rookfar'||st.rule==='ptype'){
    document.querySelectorAll('.kmark').forEach(d=>d.remove());
    const bd=$('#board');
    (st.rule==='knight'?knightTargets():st.rule==='ptype'?ptypeTargets():blankTargets()).forEach(p=>{
      const r=(p/N)|0, c=p%N, d=document.createElement('div');
      d.className='kmark';
      d.style.left=(c*(cell+GAP)+cell-14)+'px'; d.style.top=(r*(cell+GAP)+4)+'px';
      bd.appendChild(d);
    });
  }
}

/* うちあげ モーション（かり）: とんで→つみなおし */
let busy=false;
function doShot(j){
  if(busy) return; busy=true;
  const flying=shotCells(j).map(i=>board[i]);
  const up=boardw+cell;
  flying.forEach(v=>{
    const el=tileEls[v];
    el.style.zIndex='4';
    el.style.transition='transform .17s cubic-bezier(.4,0,.9,.5)';
    placeTile(v,-up);
  });
  setTimeout(()=>{
    shotApply(j);
    st.tiles.forEach(v=>{ if(flying.indexOf(v)<0) placeTile(v,0); });
    flying.forEach(v=>{ tileEls[v].style.transition='none'; placeTile(v,-up); });
    void $('#board').offsetWidth;
    requestAnimationFrame(()=>{
      flying.forEach(v=>{
        tileEls[v].style.transition='transform .26s cubic-bezier(.3,.7,.3,1.15)';
        placeTile(v,0);
      });
      setTimeout(()=>{
        flying.forEach(v=>{ tileEls[v].style.zIndex=''; tileEls[v].style.transition=''; });
        busy=false;
        moves++; $('#moveCnt').textContent=moves;
        if(isSolved()) setTimeout(clearStage,150);
      },270);
    });
  },180);
}
function after(){
  moves++; $('#moveCnt').textContent=moves;
  hiddenRefresh();
  render();
  if(isSolved()) setTimeout(clearStage,220);
}

/* ---------- タップと スワイプ ---------- */
const boardEl=$('#board');
let px=0,py=0,pr=0,pc=0,pdown=false;
function cellAt(e){
  const R=boardEl.getBoundingClientRect();
  const c=Math.min(N-1,Math.max(0,Math.floor((e.clientX-R.left)/(R.width/N))));
  const r=Math.min(N-1,Math.max(0,Math.floor((e.clientY-R.top )/(R.height/N))));
  return [r,c];
}
boardEl.addEventListener('pointerdown',e=>{
  if(busy) return;
  if(st&&st.rule==='pivot'){ const [r,c]=cellAt(e); cellsMark(pivotCells(r,c),true); }
  if(e.target.classList.contains('rotbtn')||e.target.classList.contains('pivot')
     ||e.target.classList.contains('frame')) return;
  pdown=true; px=e.clientX; py=e.clientY; [pr,pc]=cellAt(e);
});
boardEl.addEventListener('pointerup',e=>{
  if(!pdown) return; pdown=false;
  const dx=e.clientX-px, dy=e.clientY-py;
  const ax=Math.abs(dx), ay=Math.abs(dy);
  const TH=Math.max(14,cell*0.25);
  const swipe=(ax>TH||ay>TH);
  if(st.rule==='slide'||st.rule==='slide23'||st.rule==='hidden'){
    if(!swipe){ const v=board[idx(pr,pc)]; if(canSlide(v)&&slideMove(v)){ if(seenTiles) seenTiles.add(v); after(); } return; }
    const b=board.indexOf(0), br=(b/N)|0, bc=b%N;
    let ok=false;
    if(ax>=ay){ if(pr===br && ((dx>0&&bc>pc)||(dx<0&&bc<pc))) ok=true; }
    else      { if(pc===bc && ((dy>0&&br>pr)||(dy<0&&br<pr))) ok=true; }
    const v=board[idx(pr,pc)];
    if(ok && canSlide(v) && slideMove(v)){ if(seenTiles) seenTiles.add(v); after(); }
    return;
  }
  if(st.rule==='ring12'||st.rule==='grab'||st.rule==='diag'||st.rule==='fan'||st.rule==='rings3'||st.rule==='gear'||st.rule==='snake'||st.rule==='lineswap'||st.rule==='ltri'||st.rule==='altrot'||st.rule==='spinrot'||st.rule==='clock2'||st.rule==='wrap2x2'||st.rule==='mirrorrot'||st.rule==='blankrot'||st.rule==='spiral'||st.rule==='ltri3'||st.rule==='quadspin'||st.rule==='checker'||st.rule==='rotrow'||st.rule==='ringrev'||st.rule==='belt'||st.rule==='pinwheel'||st.rule==='gear4'||st.rule==='cornerrot'||st.rule==='ringseg'||st.rule==='snakeonly'||st.rule==='revonly'||st.rule==='skipswap'||st.rule==='antitr'||st.rule==='halfshift'||st.rule==='movebtn'||st.rule==='skipline'||st.rule==='ltet') return;
  if(st.rule==='transpose'||st.rule==='spin'){
    if(!swipe||ax<ay) return;
    if(st.rule==='spin'&&pr>1) return;
    shiftRow(pr,dx>0?1:-1); after(); return;
  }
  if(st.rule==='loop3'){
    if(!swipe) return;
    if(ax>=ay) seg3('row',pr,dx>0?'hi':'lo'); else seg3('col',pc,dy>0?'hi':'lo');
    after(); return;
  }
  if(st.rule==='push'){
    if(!swipe) return;
    if(ax>=ay) pushLine('row',pr,dx>0?1:-1); else pushLine('col',pc,dy>0?1:-1);
    after(); return;
  }
  if(st.rule==='knight'){
    if(!swipe && knightJump(idx(pr,pc))) after();
    return;
  }
  if(st.rule==='cross'){ if(!swipe) runSteps([()=>shiftRow(pr,1),()=>shiftCol(pc,1)]); return; }
  if(st.rule==='addcross'){
    const p=idx(pr,pc), d=swipe?-1:1;
    addCross(p,d);
    flashCells([[pr,pc],[pr+1,pc],[pr-1,pc],[pr,pc+1],[pr,pc-1]].filter(([a,b2])=>a>=0&&a<N&&b2>=0&&b2<N));
    after(); return;
  }
  if(st.rule==='addline'){
    if(!swipe) return;
    if(ax>=ay){ addRow(pr,dx>0?1:-1); flashCells([0,1,2,3].map(c=>[pr,c])); }
    else { addCol(pc,dy>0?1:-1); flashCells([0,1,2,3].map(r=>[r,pc])); }
    after(); return;
  }
  if(st.rule==='freeswap'||st.rule==='adjswap'){
    if(swipe&&st.rule==='adjswap'){
      const [dr,dc]=(ax>=ay)?[0,dx>0?1:-1]:[dy>0?1:-1,0];
      const rr=pr+dr, cc=pc+dc; if(rr<0||rr>=N||cc<0||cc>=N) return;
      swapAny(idx(pr,pc),idx(rr,cc)); swSel=-1; swMark(); after(); return;
    }
    if(swipe) return;
    const p=idx(pr,pc);
    if(swSel<0){ swSel=p; swMark(); return; }
    if(swSel===p){ swSel=-1; swMark(); return; }
    if(st.rule==='adjswap' && !isNb(swSel,p)){ swSel=p; swMark(); return; }
    swapAny(swSel,p); swSel=-1; swMark(); after(); return;
  }
  if(st.rule==='segrev'){
    if(swipe) return;
    const p=idx(pr,pc);
    if(swSel<0){ swSel=p; swMark(); return; }
    if(swSel===p){ swSel=-1; swMark(); return; }
    if(segRev(swSel,p)){ swSel=-1; swMark(); after(); }
    else{ swSel=p; swMark(); }
    return;
  }
  if(st.rule==='swapspin'){
    if(swipe){
      const [dr,dc]=(ax>=ay)?[0,dx>0?1:-1]:[dy>0?1:-1,0];
      const rr=pr+dr, cc=pc+dc;
      if(rr<0||rr>=N||cc<0||cc>=N) return;
      swSel=-1; swMark();
      runSteps([()=>swapNb(idx(pr,pc),idx(rr,cc)),()=>spinBoard(1)]);
      return;
    }
    const p=idx(pr,pc);
    if(swSel<0){ swSel=p; swMark(); return; }
    if(swSel===p){ swSel=-1; swMark(); return; }
    if(isNb(swSel,p)){ const a=swSel; swSel=-1; swMark(); runSteps([()=>swapNb(a,p),()=>spinBoard(1)]); }
    else{ swSel=p; swMark(); }
    return;
  }
  if(st.rule==='backrow'){
    if(!swipe) return;
    if(ax>=ay) backRow(Math.min(pr,N-1-pr),dx>0?1:-1); else shiftCol(pc,dy>0?1:-1);
    after(); return;
  }
  if(st.rule==='endswap'||st.rule==='speedrow'){
    if(!swipe) return;
    if(ax>=ay){ (st.rule==='endswap')?endRow(pr,dx>0?1:-1):speedRow(pr,dx>0?1:-1); }
    else shiftCol(pc,dy>0?1:-1);
    after(); return;
  }
  if(st.rule==='valline'){
    if(!swipe) return;
    const v=board[idx(pr,pc)];
    if(ax>=ay){ if(!valShift('row',pr,v)) return; }
    else { if(!valShift('col',pc,v)) return; }
    after(); return;
  }
  if(st.rule==='crossx'){
    if(!swipe) return;
    if(ax>=ay) crossX(pr,pc,dx>0?1:-1); else crossX(pr,pc,dy>0?-1:1);
    after(); return;
  }
  if(st.rule==='wrapline'){
    if(!swipe||ax<ay) return;
    wrapLine(pr,dx>0?1:-1); after(); return;
  }
  if(st.rule==='twinline'){
    if(!swipe) return;
    if(ax>=ay) twinRow(pr,dx>0?1:-1); else twinCol(pc,dy>0?1:-1);
    after(); return;
  }
  if(st.rule==='twistrow'){
    if(!swipe) return;
    if(ax>=ay) flipRow(pr); else shiftCol(pc,dy>0?1:-1);
    after(); return;
  }
  if(st.rule==='zigzag'){
    if(!swipe) return;
    if(ax>=ay) zigRow(pr,dx>0?1:-1); else zigCol(pc,dy>0?1:-1);
    after(); return;
  }
  if(st.rule==='linkall'){
    if(!swipe) return;
    if(ax>=ay){ const d=dx>0?1:-1; runSteps([()=>shiftRow(pr,d),()=>{for(let c=0;c<N;c++) shiftCol(c,1);}]); }
    else{ const d=dy>0?1:-1; runSteps([()=>shiftCol(pc,d),()=>{for(let r=0;r<N;r++) shiftRow(r,1);}]); }
    return;
  }
  if(st.rule==='blankline'){
    if(!swipe) return;
    const b=board.indexOf(0), br=(b/N)|0, bc=b%N;
    if(ax>=ay){ if(pr!==br) return; shiftRow(pr,dx>0?1:-1); }
    else      { if(pc!==bc) return; shiftCol(pc,dy>0?1:-1); }
    after(); return;
  }
  if(st.rule==='ptype'){ if(!swipe && ptypeJump(idx(pr,pc))) after(); return; }
  if(st.rule==='tempo'){
    if(!swipe) return;
    if(ax>=ay){ if(!tempoH) return; shiftRow(pr,dx>0?1:-1); }
    else      { if(tempoH) return; shiftCol(pc,dy>0?1:-1); }
    tempoH=!tempoH; tempoRefresh(); after(); return;
  }
  if(st.rule==='quad'){
    if(swipe) return;
    const q=quadOf(idx(pr,pc));
    if(quadSel<0){ quadSel=q; quadMark(); return; }
    if(quadSel===q){ quadSel=-1; quadMark(); return; }
    quadSwap(quadSel,q); quadSel=-1; quadMark(); after();
    return;
  }
  if(st.rule==='valswap'){
    if(swipe) return;
    const p=idx(pr,pc);
    if(swSel<0){ swSel=p; swMark(); return; }
    if(swSel===p){ swSel=-1; swMark(); return; }
    if(valSwap(board[swSel],board[p])){ swSel=-1; swMark(); after(); }
    else{ swSel=p; swMark(); }
    return;
  }
  if(st.rule==='kswap'){
    if(swipe) return;
    const p=idx(pr,pc);
    if(swSel<0){ swSel=p; swMark(); return; }
    if(swSel===p){ swSel=-1; swMark(); return; }
    if(knightPairs(swSel).indexOf(p)>=0){ const t=board[swSel]; board[swSel]=board[p]; board[p]=t; swSel=-1; swMark(); after(); }
    else{ swSel=p; swMark(); }
    return;
  }
  if(st.rule==='twin'){
    if(!swipe) return;
    const [dr,dc]=(ax>=ay)?[0,dx>0?1:-1]:[dy>0?1:-1,0];
    if(twinMove(dr,dc)) after();
    return;
  }
  if(st.rule==='pancake'){
    if(!swipe) return;
    let kind,i,side,len;
    if(ax>=ay){ kind='row'; i=pr; if(dx<0){ side='lo'; len=pc+1; } else { side='hi'; len=N-pc; } }
    else      { kind='col'; i=pc; if(dy<0){ side='lo'; len=pr+1; } else { side='hi'; len=N-pr; } }
    if(pancake(kind,i,side,len)){
      const cells=pancakeCells(kind,i,side,len); cellsMark(cells,true); setTimeout(()=>cellsMark([],false),260);
      after();
    }
    return;
  }
  if(st.rule==='pivot'){ cellsMark([],false); if(!swipe){ pivotMove(pr,pc); after(); } return; }
  if(st.rule==='domino'){
    const v=board[idx(pr,pc)]; if(!v) return;
    let dir=null;
    if(swipe){ dir=(ax>=ay)?(dx>0?'R':'L'):(dy>0?'D':'U'); }
    else{ const can=['L','R','U','D'].filter(d=>domCan(v,d)); if(can.length===1) dir=can[0]; }
    if(dir&&domMove(v,dir)) after();
    return;
  }
  if(st.rule==='rook'||st.rule==='torusSlide'||st.rule==='warp'){
    if(jumpIn(idx(pr,pc))) after();
    return;
  }
  if(st.rule==='xrot'){ if(!swipe && xRot(pr,pc)) after(); return; }
  if(st.rule==='rookfar'||st.rule==='diagSlide'||st.rule==='warpwall'){
    const p=idx(pr,pc);
    if(!swipe||st.rule==='rookfar'){ if(jumpIn(p)) after(); return; }
    let dr,dc;
    if(st.rule==='diagSlide'){
      const ang=Math.atan2(dy,dx);
      const cand=[[0,1,0],[1,0,Math.PI/2],[0,-1,Math.PI],[-1,0,-Math.PI/2],[1,1,Math.PI/4],[-1,-1,-3*Math.PI/4]];
      let best=null,bd=9;
      cand.forEach(([a,b2,t])=>{ let d=Math.abs(ang-t); d=Math.min(d,2*Math.PI-d); if(d<bd){bd=d;best=[a,b2];} });
      [dr,dc]=best;
    }else{ [dr,dc]=(ax>=ay)?[0,dx>0?1:-1]:[dy>0?1:-1,0]; }
    const tr=pr+dr, tc=pc+dc;
    if(tr>=0&&tr<N&&tc>=0&&tc<N && board[idx(tr,tc)]===0 && jumpIn(p)){ after(); return; }
    if(st.rule==='warpwall' && jumpIn(p)) after();       /* ワープ さきが あきなら とぶ */
    return;
  }
  if(st.rule==='torus23'){
    const p=idx(pr,pc), v=board[p]; if(!v) return;
    const z=board.indexOf(0), zr=(z/N)|0, zc=z%N;
    let kind=null; if(pr===zr) kind='row'; else if(pc===zc) kind='col';
    if(!kind) return;
    /* なぞった むき d に うごくとき、あきは タップした ますから d の むきに k こ さき */
    const pos = kind==='row' ? pc : pr, zpos = kind==='row' ? zc : zr;
    const kOf = d => ((zpos - pos)*d + N*4) % N;          /* d の むきに すすんで あきに つく までの かず */
    let cands=[];
    if(swipe){
      const horiz=(ax>=ay); if((kind==='row')!==horiz) return;
      const d = horiz ? (dx>0?1:-1) : (dy>0?1:-1);
      cands=[[d,kOf(d)]];
    }else{
      cands=[[1,kOf(1)],[-1,kOf(-1)]];
    }
    cands=cands.filter(([d,k])=>k===2||k===3);
    if(!cands.length) return;
    const [d,k]=cands[0];
    /* あきの がわから みると、あきから -d の むきに k こ */
    torus23Move(kind,-d,k); after();
    return;
  }
  if(st.rule==='plus'){ if(!swipe){ plusMove(pr,pc); after(); } return; }
  if(st.rule==='near'||st.rule==='oddeven'){
    const p=idx(pr,pc);
    if(swipe){
      const [dr,dc]=(ax>=ay)?[0,dx>0?1:-1]:[dy>0?1:-1,0];
      const rr=pr+dr, cc=pc+dc;
      if(rr<0||rr>=N||cc<0||cc>=N) return;
      const q=idx(rr,cc);
      if(swapOK(p,q)){ swapCells(p,q); swSel=-1; swMark(); after(); }
      return;
    }
    if(swSel<0){ swSel=p; swMark(); return; }
    if(swSel===p){ swSel=-1; swMark(); return; }
    if(swapOK(swSel,p)){ swapCells(swSel,p); swSel=-1; swMark(); after(); }
    else{ swSel=p; swMark(); }
    return;
  }
  if(st.rule==='glide'){
    const p=idx(pr,pc); if(!board[p]) return;
    let dir=null;
    if(swipe){ dir=(ax>=ay)?[0,dx>0?1:-1]:[dy>0?1:-1,0]; }
    else{ const can=[[0,1],[0,-1],[1,0],[-1,0]].filter(([dr,dc])=>glideDest(p,dr,dc)>=0); if(can.length===1) dir=can[0]; }
    if(dir && glide(p,dir[0],dir[1])) after();
    return;
  }
  if(st.rule==='mirror'){
    const t=idx(pr,pc);
    const cands=mirrorPairs().filter(([tt,a])=>tt===t);
    if(!cands.length) return;
    const want=(ax>=ay)?(dx>0?[0,1]:[0,-1]):(dy>0?[1,0]:[-1,0]);
    const dirOf=([tt,a])=>[(((a/N)|0)-pr),((a%N)-pc)];
    let pick=null;
    if(swipe){ pick=cands.find(c=>{const d=dirOf(c); return d[0]===want[0]&&d[1]===want[1];}); }
    else{ pick = cands.length===1 ? cands[0] : (cands.find(c=>dirOf(c)[0]===0) || cands[0]); }
    if(pick && mirrorMove(pick[0],pick[1])) after();
    return;
  }
  if(st.rule==='glue'){
    const p=idx(pr,pc);
    const ms=glueMoves().filter(m=> m[0]==='one' ? m[1]===p : board[p]===GLUE);
    if(!ms.length) return;
    let pick=ms[0];
    if(swipe){
      const [dr,dc]=(ax>=ay)?[0,dx>0?1:-1]:[dy>0?1:-1,0];
      const f=ms.find(m=>{
        if(m[0]==='one'){ const zr=(m[2]/N)|0, zc=m[2]%N; return zr-pr===dr&&zc-pc===dc; }
        const cs=glueCells(); return (((m[1]/N)|0)-((cs[0]/N)|0))===dr && ((m[1]%N)-(cs[0]%N))===dc;
      });
      if(!f) return; pick=f;
    }
    glueApply(pick); after(); return;
  }
  if(GENERIC[st.rule]||st.rule==='stet'||st.rule==='bigsq'||st.rule==='pairswap'||st.rule==='ring6'
     ||st.rule==='donut'||st.rule==='ring2c'||st.rule==='three4'||st.rule==='rot180') return;
  if(st.rule==='seg3any'){
    if(!swipe) return;
    if(ax>=ay){ const a=(pc<=1)?0:1; seg3Any('row',pr,a,dx>0?1:-1); }
    else { const a=(pr<=1)?0:1; seg3Any('col',pc,a,dy>0?1:-1); }
    after(); return;
  }
  if(st.rule==='midpush'){
    if(!swipe) return;
    if(ax>=ay){ if(pr!==0&&pr!==3) return; midPush(pr,dx>0?1:-1); }
    else shiftCol(pc,dy>0?1:-1);
    after(); return;
  }
  if(st.rule==='vloop2'){
    if(!swipe) return;
    if(ax>=ay) shiftRow(pr,dx>0?1:-1); else vLoop(pc<2?0:1, dy>0?1:-1);
    after(); return;
  }
  if(st.rule==='nextrev'){
    if(!swipe) return;
    if(ax>=ay) nextRev(pr,dx>0?1:-1); else shiftCol(pc,dy>0?1:-1);
    after(); return;
  }
  if(st.rule==='keep1'){
    if(!swipe){
      swSel=(swSel===idx(pr,pc))?-1:idx(pr,pc); swMark(); return;
    }
    if(swSel<0) return;
    const sr=(swSel/N)|0, sc=swSel%N;
    if(ax>=ay){ if(pr!==sr) return; keepMove('row',sr,sc); }
    else { if(pc!==sc) return; keepMove('col',sc,sr); }
    swSel=-1; swMark(); after(); return;
  }
  if(st.rule==='rowtr'){
    if(!swipe||ax<ay) return;
    const d=dx>0?1:-1;
    runSteps([()=>shiftRow(pr,d),()=>transposeBoard()]);
    return;
  }
  if(st.rule==='twistshift'||st.rule==='rowskip'){
    if(!swipe) return;
    const kind=(ax>=ay)?'row':'col', i=(kind==='row')?pr:pc;
    const d=(kind==='row')?(dx>0?1:-1):(dy>0?1:-1);
    if(st.rule==='twistshift') twistShift(kind,i,d);
    else { if(i>=2) return; rowSkipMove(kind,i,d); }
    after(); return;
  }
  if(st.rule==='oddvert'){
    if(swipe) return;
    const p=idx(pr,pc);
    const m=oddVertMoves().filter(x=>x[0]===p);
    if(!m.length) return;
    board[m[0][1]]=board[p]; board[p]=0; after(); return;
  }
  if(st.rule==='midrev'){
    if(!swipe) return;
    if(ax>=ay) midRev(pr,dx>0?1:-1); else shiftCol(pc,dy>0?1:-1);
    after(); return;
  }
  if(st.rule==='shiftskip'){
    if(!swipe) return;
    if(ax>=ay) shiftSkip(pr,dx>0?1:-1); else shiftCol(pc,dy>0?1:-1);
    after(); return;
  }
  if(st.rule==='twoloop'){
    if(!swipe) return;
    if(ax>=ay) twoLoop(pr<2?0:1, dx>0?1:-1); else shiftCol(pc,dy>0?1:-1);
    after(); return;
  }
  if(st.rule==='cascade'){
    if(!swipe) return;
    if(ax>=ay) cascadeRow(pr,dx>0?1:-1); else shiftCol(pc,dy>0?1:-1);
    after(); return;
  }
  if(st.rule==='rowflip'){
    if(!swipe) return;
    if(ax>=ay){ const d=dx>0?1:-1; runSteps([()=>shiftRow(pr,d),()=>flipBoard()]); }
    else { shiftCol(pc,dy>0?1:-1); after(); }
    return;
  }
  if(st.rule==='phase'){
    if(!swipe||!phaseLoop()) return;
    if(ax>=ay) shiftRow(pr,dx>0?1:-1); else shiftCol(pc,dy>0?1:-1);
    phaseStep(); after(); return;
  }
  if(st.rule==='frozen'||st.rule==='pillar'){
    const v=board[idx(pr,pc)];
    if(!swipe){ if(canSlide(v)&&slideMove(v)) after(); return; }
    const b=board.indexOf(0), br=(b/N)|0, bc=b%N; let ok=false;
    if(ax>=ay){ if(pr===br && ((dx>0&&bc>pc)||(dx<0&&bc<pc))) ok=true; }
    else      { if(pc===bc && ((dy>0&&br>pr)||(dy<0&&br<pr))) ok=true; }
    if(ok && canSlide(v) && slideMove(v)) after();
    return;
  }
  if(st.rule==='insert'){
    const p=idx(pr,pc);
    if(swipe){
      /* ドラッグ: はなした ますへ さす */
      const [qr,qc]=cellAt(e); const q=idx(qr,qc);
      if(insertMove(p,q)){ insSel=-1; insMark(); after(); }
      return;
    }
    if(insSel<0){ insSel=p; insMark(); return; }
    if(insSel===p){ insSel=-1; insMark(); return; }
    if(insertMove(insSel,p)){ insSel=-1; insMark(); after(); }
    else{ insSel=p; insMark(); }
    return;
  }
  if(st.rule==='shot'){
    if(pr===N-1) doShot(pc);
    return;
  }
  if(st.rule==='shotRow'){
    if(pr!==N-1) return;
    if(swipe && ax>=ay){ shiftRow(N-1, dx>0?1:-1); after(); }
    else if(!swipe){ doShot(pc); }
    return;
  }
  if(st.rule==='torus'||st.rule==='torusRD'){
    if(!swipe) return;
    const rd=(st.rule==='torusRD');
    if(ax>=ay){ const d=dx>0?1:-1; if(rd&&d<0) return; shiftRow(pr,d); after(); }
    else      { const d=dy>0?1:-1; if(rd&&d<0) return; shiftCol(pc,d); after(); }
  }
});

let lineSel=null;
function lineMark(){
  document.querySelectorAll('.grabmark').forEach(d=>d.remove());
  document.querySelectorAll('.handle').forEach(h=>h.classList.remove('on'));
  if(!lineSel) return;
  const h=document.querySelector('.handle[data-kind="'+lineSel.kind+'"][data-i="'+lineSel.i+'"]');
  if(h) h.classList.add('on');
  const d=document.createElement('div'); d.className='grabmark';
  const L4=cell*N+GAP*(N-1), u=cell+GAP;
  if(lineSel.kind==='row'){ d.style.left='0px'; d.style.top=(lineSel.i*u)+'px'; d.style.width=L4+'px'; d.style.height=cell+'px'; }
  else{ d.style.top='0px'; d.style.left=(lineSel.i*u)+'px'; d.style.height=L4+'px'; d.style.width=cell+'px'; }
  $('#board').appendChild(d);
}
function lineUp(kind,i,e){
  const el=document.elementFromPoint(e.clientX,e.clientY);
  let tk=kind,ti=i;
  if(el&&el.classList.contains('handle')&&el.dataset.kind){ tk=el.dataset.kind; ti=+el.dataset.i; }
  if(tk===kind && ti!==i){ swapLines(kind,i,ti); lineSel=null; lineMark(); after(); return; }
  if(lineSel && lineSel.kind===kind && lineSel.i!==i){ swapLines(kind,lineSel.i,i); lineSel=null; lineMark(); after(); return; }
  lineSel=(lineSel&&lineSel.kind===kind&&lineSel.i===i)?null:{kind,i};
  lineMark();
}
/* かずで きまる いれかえ の えらび */
let swSel=-1;
function swMark(){
  document.querySelectorAll('.grabmark,.kmark').forEach(d=>d.remove());
  if(swSel<0) return;
  const bd=$('#board');
  const r=(swSel/N)|0, c=swSel%N, d=document.createElement('div');
  d.className='grabmark';
  d.style.left=(c*(cell+GAP))+'px'; d.style.top=(r*(cell+GAP))+'px';
  d.style.width=cell+'px'; d.style.height=cell+'px'; bd.appendChild(d);
  const targets = (st.rule==='keep1'||st.rule==='freeswap') ? []
    : (st.rule==='adjswap') ? [[0,1],[0,-1],[1,0],[-1,0]].map(([dr,dc])=>[((swSel/N)|0)+dr,(swSel%N)+dc])
        .filter(([rr,cc])=>rr>=0&&rr<N&&cc>=0&&cc<N).map(([rr,cc])=>idx(rr,cc))
    : (st.rule==='segrev')
    ? [0,1,2,3].flatMap(k=>[idx((swSel/N)|0,k),idx(k,swSel%N)]).filter(q=>segCells(swSel,q))
    : (st.rule==='swapspin')
    ? [[0,1],[0,-1],[1,0],[-1,0]].map(([dr,dc])=>[((swSel/N)|0)+dr,(swSel%N)+dc])
        .filter(([rr,cc])=>rr>=0&&rr<N&&cc>=0&&cc<N).map(([rr,cc])=>idx(rr,cc))
    : (st.rule==='kswap') ? knightPairs(swSel)
    : (st.rule==='valswap') ? valPartners(board[swSel]).map(w=>board.indexOf(w))
    : [[0,1],[0,-1],[1,0],[-1,0]].map(([dr,dc])=>[r+dr,c+dc]).filter(([rr,cc])=>rr>=0&&rr<N&&cc>=0&&cc<N).map(([rr,cc])=>idx(rr,cc)).filter(q=>swapOK(swSel,q));
  targets.forEach(q=>{
    const rr=(q/N)|0, cc=q%N, k=document.createElement('div'); k.className='kmark';
    k.style.left=(cc*(cell+GAP)+cell-14)+'px'; k.style.top=(rr*(cell+GAP)+4)+'px';
    bd.appendChild(k);
  });
}

const z=n=>String(n).padStart(2,'0');
function clearStage(){
  const before=clearedCount();
  if(st.no<=TOTAL && !clearedSet.has(st.no)){ clearedSet.add(st.no); save(); }
  const now=clearedCount();
  let txt=moves+'てで そろいました';
  if(st.no<=TOTAL){
    const opened=TIERS.filter(t=>t.need>0 && before<t.need && now>=t.need);
    if(opened.length) txt+='\n'+opened.map(t=>z(t.from)+'〜'+z(t.to)+' が あそべるように なりました').join('\n');
    else{
      const nxt=TIERS.find(t=>now<t.need);
      if(nxt) txt+='\n'+z(nxt.from)+'〜'+z(nxt.to)+' まで あと '+(nxt.need-now)+'こ';
    }
  }
  $('#clearTxt').textContent=txt;
  const arr=(st.no>100)?BONUS:STAGES, i=arr.findIndex(x=>x.no===st.no);
  const nextS=arr[i+1];
  $('#cNext').classList.toggle('hide', !nextS || !isOpen(nextS.no));
  $('#clearMask').classList.remove('hide');
  const s=$('#stamp'); s.style.animation='none'; void s.offsetWidth; s.style.animation='';
}
function findStage(no){ return STAGES.find(s=>s.no===no)||BONUS.find(s=>s.no===no); }
function openStage(no){
  st=findStage(no); if(!st||!isOpen(no)) return;
  goal = st.start ? st.start.slice()
       : st.goalOrder ? goalByOrder(st.goalOrder, st.tiles, st.blank)
       : st.rule==='glue' ? [GLUE,GLUE].concat(st.tiles.filter(v=>v!==GLUE)).concat([0,0])
       : st.rule==='domino' ? DOM_GOAL.slice()
       : st.blank ? (st.blankAt==='head' ? [0].concat(st.tiles) : st.tiles.concat([0])) : st.tiles.slice();
  if(st.rule==='push'){ goal=RANGE(1,16); outside=EXTRA; }
  if(st.rule==='mirror'){ goal=[0].concat(st.tiles).concat([0]); }
  if(st.rule==='glide'||st.rule==='twin'){ goal=st.tiles.concat([0,0]); }
  swSel=-1;
  if(st.rule==='frozen'){
    goal=new Array(16).fill(0); let k=1;
    for(let i=0;i<16;i++){ if(STONES.indexOf(i)>=0) goal[i]=STONE; else if(k<=13){ goal[i]=k++; } }
  }
  if(st.rule==='oddvert'){ goal=st.tiles.concat([0,0,0]); }
  if(st.rule==='pillar'){
    goal=new Array(16).fill(0); let k=1;
    for(let i=0;i<16;i++){ if(PILLARS.indexOf(i)>=0) goal[i]=STONE; else if(k<=11){ goal[i]=k++; } }
  }
  phaseN=0; btnPos=0;
  insSel=-1; lineSel=null; altDir=1; quadSel=-1; tempoH=true;
  seenTiles=(st.rule==='hidden')?new Set():null;
  moves=0; $('#moveCnt').textContent='0';
  const bonus=(st.no>100);
  $('#pNo').textContent=bonus?('#'+z(st.no-100)):z(st.no);
  $('#pStar').textContent = st.star ? '\u2605'.repeat(st.star) : '';
  $('#pStar').className='pstar s'+(st.star||0);
  $('#pNo').classList.toggle('bonus',bonus);
  $('#pName').textContent=st.name;
  $('#pHint').textContent=st.hint;
  $('#selectScreen').classList.add('hide');
  $('#playScreen').classList.remove('hide');
  $('#clearMask').classList.add('hide');
  window.scrollTo(0,0);
  layout(); shuffle(); buildBoard();
}

      '<span class="lg"><i class="lgbox g"></i>ゴールが ちがう（かずの きまりを みたす）</span>'+
      '<span class="lg"><i class="lgbox d"></i>クリアずみ</span>'+
      '<span class="lg"><span class="st s3">\u2605\u2605\u2605</span>むずかしさ（1〜5）。やさしい じゅんに ならんでいます</span>'
    : '<span class="lg"><i class="lgbox b"></i>ボツに した ルール（あそべるが すすみぐあいには かぞえない）</span>';
  $('#lead').textContent = (listMode==='main')
    ? 'ルールの ちがう ならべものが '+STAGES.length+'だん'
    : 'つくったけれど はずした ルール（'+BONUS.length+'こ）';
  if(listMode==='bonus'){
    BONUS.forEach(s=>{
      const btn=document.createElement('button');
      btn.className='card next bonus';
      btn.innerHTML='<span class="glyph">'+(GLYPH[s.rule]||GLYPH.soon)+'</span>'+
        '<span class="txt"><span class="no">#'+z(s.no-100)+'</span>'+
        '<span class="nm">'+s.name+'</span></span>';
      btn.onclick=()=>openStage(s.no);
      list.appendChild(btn);
    });
    document.querySelectorAll('.colbtn:not(.mobtn)').forEach(b=>
      b.classList.toggle('on', +b.dataset.col===cols));
    return;
  }
  const cnt=clearedCount();
  let lastTier=null;
  for(const s of STAGES){
    const t=tierOf(s.no);
    if(t!==lastTier){
      lastTier=t;
      const h=document.createElement('div'); h.className='tierhd'+(isOpen(s.no)?'':' locked');
      h.innerHTML='<span class="tno">だい '+(TIERS.indexOf(t)+1)+'だん</span><span class="trg">'+z(t.from)+'〜'+z(t.to)+'</span>'+
        '<span class="tneed">'+(t.need===0?'さいしょから あそべる':(isOpen(s.no)?'かいほうずみ':'あと '+(t.need-cnt)+'こ クリアで かいほう（'+t.need+'こ）'))+'</span>';
      list.appendChild(h);
    }
    const done=isCleared(s.no), open=isOpen(s.no);
    const btn=document.createElement('button');
    btn.className='card '+(done?'done':'next')+(open?'':' locked');
    btn.innerHTML='<span class="glyph">'+(open?(GLYPH[s.pred]||GLYPH[s.rule]||GLYPH.soon):GLYPH.lock)+'</span>'+
      '<span class="txt"><span class="no">'+z(s.no)+'<span class="st s'+s.star+'">'+'\u2605'.repeat(s.star)+'</span></span>'+
      '<span class="nm">'+(open?s.name:'？？？')+'</span></span>';
    if(s.pred&&open) btn.classList.add('goal');
    if(open) btn.onclick=()=>openStage(s.no); else btn.disabled=true;
    list.appendChild(btn);
  }
  $('#lead').textContent='ルールの ちがう ならべものが '+STAGES.length+'だん ／ クリア '+cnt+'／'+TOTAL;
  document.querySelectorAll('.colbtn').forEach(b=>
    b.classList.toggle('on', +b.dataset.col===cols));
}

/* ---------- イベント ---------- */
$('#toSelect').onclick=toSelect;
$('#cBack').onclick=toSelect;
$('#cNext').onclick=()=>{
  const arr=(st.no>100)?BONUS:STAGES, i=arr.findIndex(x=>x.no===st.no);
  if(i>=0&&i+1<arr.length&&isOpen(arr[i+1].no)) openStage(arr[i+1].no);
};
$('#bonusBtn').onclick=()=>{ listMode=(listMode==='main')?'bonus':'main'; buildList(); window.scrollTo(0,0); };
$('#cRetry').onclick=()=>openStage(st.no);
$('#reshuffle').onclick=()=>openStage(st.no);
document.querySelectorAll('.colbtn').forEach(b=>b.onclick=()=>{
  cols=+b.dataset.col; save(); buildList();
});
document.querySelectorAll('.mobtn').forEach(b=>b.onclick=()=>{
  motion=b.dataset.m; save(); motionRefresh();
});
$('#resetBtn').onclick=()=>{ if(confirm('すすみぐあいを けしますか')){clearedSet=new Set();save();buildList();} };
let rz=null;
function relayout(){
  if(!st||$('#playScreen').classList.contains('hide')) return;
  layout(); buildBoard();
}
window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(relayout,120);});
window.addEventListener('orientationchange',()=>{clearTimeout(rz);rz=setTimeout(relayout,300);});

$('#lead').textContent='ルールの ちがう ならべものが '+STAGES.length+'だん';
motionRefresh();
buildList();
</script>
</body>
</html>
