<script>
/* 実機デバッグ用：JSエラーを画面下に赤帯で表示（Chrome39でも動くES5） */
window.onerror = function(msg, url, line){
  var d = document.getElementById('errbox');
  if (!d) {
    d = document.createElement('div');
    d.id = 'errbox';
    d.style.position = 'fixed'; d.style.left = '0'; d.style.right = '0'; d.style.bottom = '0';
    d.style.background = '#c0392b'; d.style.color = '#fff';
    d.style.font = '12px monospace'; d.style.padding = '8px'; d.style.zIndex = '99999';
    d.style.whiteSpace = 'pre-wrap';
    document.body.appendChild(d);
  }
  d.appendChild(document.createTextNode('ERR: ' + msg + ' (line ' + line + ')\n'));
  return false;
};

<script>
(function(){
  var CELLS = 10;
  var mode = 'drain';
  var setMs = 60000;
  var remainMs = 60000;
  var running = false;
  var endAt = 0;
  var tickId = null;
  var editing = false;
  var alarmVol = 0.67;              // 0=無し / .34小 / .67中 / 1大
  var audioCtx = null;
  function initAudio(){
    if (audioCtx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch (e) { audioCtx = null; }
  }
  var soundType = 'pipi';          // pipi / buzz / bell
  var repeatOn = false;
  function beep(t, freq, dur, vol, type){
    if (!audioCtx) return;
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.03);
  }
  function playAlarm(){
    if (!audioCtx || alarmVol <= 0) return;
    var t = audioCtx.currentTime, v = alarmVol * 0.3;
    if (soundType === 'buzz') {
      beep(t, 200, 0.55, v); beep(t + 0.6, 200, 0.55, v);
    } else if (soundType === 'bell') {
      beep(t, 1318, 0.5, v * 0.9, 'triangle'); beep(t + 0.18, 1760, 0.6, v * 0.9, 'triangle');
    } else {
      beep(t, 880, 0.15, v); beep(t + 0.22, 880, 0.15, v); beep(t + 0.44, 1174, 0.32, v);
    }
  }

  /* 追加機能は個別にtry/catch。失敗したらその機能だけ無効化し、赤帯に機能名を表示 */
  function showErr(text){
    var d = document.getElementById('errbox');
    if (!d) {
      d = document.createElement('div'); d.id = 'errbox';
      d.style.position='fixed'; d.style.left='0'; d.style.right='0'; d.style.bottom='0';
      d.style.background='#c0392b'; d.style.color='#fff'; d.style.font='12px monospace';
      d.style.padding='8px'; d.style.zIndex='99999'; d.style.whiteSpace='pre-wrap';
      document.body.appendChild(d);
    }
    d.appendChild(document.createTextNode(text + '\n'));
  }
  function feature(name, key, fn){
    try { fn(); }
    catch (e) {
      showErr('機能「' + name + '」を無効化: ' + (e && e.message ? e.message : e));
      var el = document.getElementById('feat-' + key);
      if (el) el.style.display = 'none';
    }
  }

  // 要素参照（これ以降で使うので先に取得）
  var meterEl  = document.getElementById('meter');
  var timeEl   = document.getElementById('time');
  var startBtn = document.getElementById('startBtn');
  var resetBtn = document.getElementById('resetBtn');

  // 終了時の点滅（メーターを数回チカチカ）
  var blinkOn = true;
  var blinkTimer = null;
  function stopBlink(){ if (blinkTimer) { clearInterval(blinkTimer); blinkTimer = null; } meterEl.style.opacity = '1'; }
  function startBlink(){
    stopBlink();
    if (!blinkOn) return;
    var on = true, count = 0;
    blinkTimer = setInterval(function(){
      on = !on; count++;
      meterEl.style.opacity = on ? '1' : '0.25';
      if (count >= 8) { stopBlink(); }
    }, 300);
  }

  // 追加機能で使う状態
  var cellNodes = [];              // メーターの四角（scaleElを除外して描画するため）
  var countUp = false;             // カウント方法（false=ダウン, true=アップ）
  var meterColor = null;           // メーターの色（nullで標準）
  var scaleOn = false, scaleCount = 3;
  var fadeStyle = 'step';          // 消え方（step=一つ一つ / shave=徐々に）
  var currentTheme = 'light';      // 背景テーマ（消え方=徐々に の色計算に使用）
  var layoutMode = false;          // 自由配置モード中か
  var THEME_COLORS = {
    light: { ink:'#141414', paper:'#f4f4f4' },
    dark:  { ink:'#f4f4f4', paper:'#141414' },
    sepia: { ink:'#4a3f30', paper:'#efe6d3' }
  };

  // 目盛り △スケール（メーター右に絶対配置）
  meterEl.style.position = 'relative';
  var scaleEl = document.createElement('div');
  scaleEl.style.position = 'absolute';
  scaleEl.style.left = '100%'; scaleEl.style.top = '0'; scaleEl.style.bottom = '0';
  scaleEl.style.marginLeft = '10px'; scaleEl.style.width = '22px'; scaleEl.style.display = 'none';
  meterEl.appendChild(scaleEl);
  function renderScale(){
    while (scaleEl.firstChild) scaleEl.removeChild(scaleEl.firstChild);
    if (!scaleOn) { scaleEl.style.display = 'none'; return; }
    scaleEl.style.display = 'block';
    var h = Math.floor(300 / scaleCount) - 6; if (h < 6) h = 6;
    for (var i = 0; i < scaleCount; i++) {
      var t = document.createElement('div');
      t.style.width = '0'; t.style.height = '0'; t.style.margin = '3px auto';
      t.style.borderLeft = '10px solid transparent';
      t.style.borderRight = '10px solid transparent';
      if (mode === 'fill') t.style.borderBottom = h + 'px solid currentColor';   // △上向き
      else t.style.borderTop = h + 'px solid currentColor';                      // ▽下向き
      scaleEl.appendChild(t);
    }
  }

  function buildMeter(){
    while (meterEl.firstChild) { meterEl.removeChild(meterEl.firstChild); }
    cellNodes = [];
    var INNER = 300, MARGIN = 5;                       // メーターの総高さは常に一定
    var cellH = (INNER - (CELLS - 1) * MARGIN) / CELLS;
    if (cellH < 4) cellH = 4;
    for (var i = 0; i < CELLS; i++) {
      var d = document.createElement('div');
      d.className = 'cell' + (i === CELLS - 1 ? ' last' : '');
      d.style.height = cellH + 'px';
      meterEl.appendChild(d);
      cellNodes.push(d);
    }
    if (scaleEl) meterEl.appendChild(scaleEl);          // 目盛りを末尾に戻す
  }

  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function fmt(ms){
    var s = Math.ceil(ms / 1000);
    if (s < 0) s = 0;
    var m = Math.floor(s / 60);
    return pad(m) + ':' + pad(s - m * 60);
  }

  function parseTime(str){
    if (!str) return null;
    str = ('' + str).replace(/\s/g, '');
    if (str.indexOf(':') >= 0) {
      var p = str.split(':');
      var mm = parseInt(p[0], 10);
      var ss = parseInt(p[1], 10);
      if (isNaN(mm) || isNaN(ss)) return null;
      return (mm * 60 + ss) * 1000;
    }
    var digits = str.replace(/[^0-9]/g, '');
    if (!digits.length) return null;
    var num = parseInt(digits, 10);
    if (isNaN(num)) return null;
    if (digits.length <= 2) return num * 1000;            // 秒
    var secPart = parseInt(digits.slice(-2), 10);
    var minPart = parseInt(digits.slice(0, digits.length - 2), 10);
    return (minPart * 60 + secPart) * 1000;
  }

  function render(){
    if (!editing) timeEl.value = fmt(countUp ? (setMs - remainMs) : remainMs);
    var per = setMs / CELLS;
    var remF = per > 0 ? remainMs / per : 0;
    if (remF < 0) remF = 0;
    if (remF > CELLS) remF = CELLS;
    var onF = (mode === 'fill') ? (CELLS - remF) : remF;
    var tc = THEME_COLORS[currentTheme] || THEME_COLORS.light;
    var onColor = meterColor || tc.ink;
    var offColor = tc.paper;
    var full = Math.floor(onF + 0.0001);
    var onCount = Math.ceil(onF - 0.0001); if (onCount < 0) onCount = 0;
    for (var i = 0; i < cellNodes.length; i++) {
      var f = cellNodes.length - i;               // 1 = 一番下
      var base = 'cell' + (i === cellNodes.length - 1 ? ' last' : '');
      if (fadeStyle === 'shave') {
        cellNodes[i].className = base;
        if (f <= full) {
          cellNodes[i].style.background = onColor;
        } else if (f === full + 1) {
          var frac = onF - full; if (frac < 0) frac = 0; if (frac > 1) frac = 1;
          var pct = Math.round(frac * 100);
          cellNodes[i].style.background = 'linear-gradient(to top, ' + onColor + ' ' + pct + '%, ' + offColor + ' ' + pct + '%)';
        } else {
          cellNodes[i].style.background = '';
        }
      } else {
        var on = f <= onCount;
        cellNodes[i].className = on ? base + ' on' : base;
        cellNodes[i].style.background = (on && meterColor) ? meterColor : '';
      }
    }
  }

  function tick(){
    if (!running) return;
    remainMs = endAt - (new Date()).getTime();
    if (remainMs <= 0) {
      remainMs = 0;
      running = false;
      if (tickId) { clearInterval(tickId); tickId = null; }
      startBtn.innerHTML = 'START';
      playAlarm();
      startBlink();
      render();
      if (repeatOn && setMs > 0) {
        setTimeout(function(){
          if (!running && repeatOn && setMs > 0) {
            stopBlink();
            remainMs = setMs;
            endAt = (new Date()).getTime() + remainMs;
            running = true;
            startBtn.innerHTML = 'PAUSE';
            if (tickId) clearInterval(tickId);
            tickId = setInterval(tick, 100);
          }
        }, 1200);
      }
      return;
    }
    render();
  }

    stopBlink();
    if (!running && remainMs <= 0) remainMs = setMs;
    if (!running && (remainMs === setMs || remainMs <= 0)) { setMs = parsed; remainMs = parsed; }
    else if (!running && setMs !== parsed && remainMs === setMs) { setMs = parsed; remainMs = parsed; }
    // 開始
    setMs = (remainMs === 0 ? parsed : setMs);
    if (remainMs <= 0) remainMs = setMs;
    endAt = (new Date()).getTime() + remainMs;
    running = true;
    startBtn.innerHTML = 'PAUSE';
    if (tickId) clearInterval(tickId);
    tickId = setInterval(tick, 100);

        b.onclick = function(){
          var el = document.documentElement;
          if (b.getAttribute('data-fs') === 'on') {
            var req = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen || el.mozRequestFullScreen;
            if (req) req.call(el);
          } else {
            var exit = document.exitFullscreen || document.webkitExitFullscreen || document.webkitCancelFullScreen || document.mozCancelFullScreen;
            if (exit) exit.call(document);
          }
        };
      })(btns[i]);
    }
  });

  feature('ラベル', 'label', function(){
    var inp = document.getElementById('labelInput');
    var lab = document.getElementById('labelText');
    function setLabel(v){
      lab.innerHTML = '';
      lab.appendChild(document.createTextNode(v));
      lab.style.display = v ? 'block' : 'none';
      try { localStorage.setItem('timerLiteLabel', v); } catch (e) {}
    }
    inp.oninput = function(){ setLabel(inp.value); };
    var sv = null; try { sv = localStorage.getItem('timerLiteLabel'); } catch (e) {}
    if (sv) { inp.value = sv; setLabel(sv); }
  });

  feature('自由配置', 'freelayout', function(){
    var LP = [
      { k:'meter', el:meterEl },
      { k:'digit', el:timeEl },
      { k:'start', el:startBtn },
      { k:'reset', el:resetBtn },
      { k:'label', el:document.getElementById('labelText') }
    ];
    var NAMES = { meter:'メーター', digit:'数字', start:'START', reset:'RESET', label:'ラベル' };
    var lay = {};
    for (var i = 0; i < LP.length; i++) lay[LP[i].k] = { x:0, y:0, rot:0, scale:1 };
    var pad = document.getElementById('lfPad');
    var badge = document.getElementById('lfBadge');
    var selKey = 'meter';

    function elOf(k){ for (var i = 0; i < LP.length; i++) if (LP[i].k === k) return LP[i].el; return null; }
    function apply(k){
      var el = elOf(k); if (!el) return;
      var t = lay[k];
      var s = 'translate(' + Math.round(t.x) + 'px,' + Math.round(t.y) + 'px) rotate(' + t.rot + 'deg) scale(' + t.scale + ')';
      el.style.webkitTransform = s; el.style.transform = s;
    }
    function applyAll(){ for (var i = 0; i < LP.length; i++) apply(LP[i].k); }
    function badgeUpd(){
      var t = lay[selKey];
      badge.innerHTML = '';
      badge.appendChild(document.createTextNode(NAMES[selKey] + '  x:' + Math.round(t.x) + ' y:' + Math.round(t.y) + '  ' + (((t.rot % 360) + 360) % 360) + '°  ' + t.scale.toFixed(1) + 'x'));
    }
    function outlines(){
      for (var i = 0; i < LP.length; i++) {
        var el = LP[i].el; if (!el) continue;
        if (!layoutMode) { el.style.outline = ''; continue; }
        el.style.outline = (LP[i].k === selKey) ? '3px solid #e14b4b' : '1px solid rgba(120,120,120,.6)';
        el.style.outlineOffset = '2px';
      }
    }
    function selectPart(k){
      selKey = k;
      var pb = document.querySelectorAll('.lfp');
      for (var i = 0; i < pb.length; i++) pb[i].className = (pb[i].getAttribute('data-lfpart') === k) ? 'lfp on' : 'lfp';
      outlines(); badgeUpd();
    }
    function save(){
      try {
        var o = '';
        for (var i = 0; i < LP.length; i++) { var k = LP[i].k, t = lay[k]; o += k + ':' + Math.round(t.x) + ',' + Math.round(t.y) + ',' + t.rot + ',' + t.scale + '|'; }
        localStorage.setItem('timerLiteFreeLayout', o);
      } catch (e) {}
    }
    function load(){
      try {
        var s = localStorage.getItem('timerLiteFreeLayout'); if (!s) return;
        var arr = s.split('|');
        for (var i = 0; i < arr.length; i++) {
          if (!arr[i]) continue;
          var c = arr[i].indexOf(':'); var k = arr[i].slice(0, c); var v = arr[i].slice(c + 1).split(',');
          if (lay[k] && v.length === 4) lay[k] = { x:+v[0], y:+v[1], rot:+v[2], scale:+v[3] };
        }
      } catch (e) {}
    }
    function enter(){ if (running) pause(); layoutMode = true; pad.style.display = 'block'; badge.style.display = 'block'; selectPart(selKey); }
    function exit(){ layoutMode = false; pad.style.display = 'none'; badge.style.display = 'none'; outlines(); save(); }

    // ドラッグ（タッチ＋マウス）
    var dragK = null, dsx = 0, dsy = 0, dox = 0, doy = 0;
    function xy(e){ if (e.touches && e.touches.length) return { x:e.touches[0].clientX, y:e.touches[0].clientY }; return { x:e.clientX, y:e.clientY }; }
    function down(k, e){ if (!layoutMode) return; if (e.preventDefault) e.preventDefault(); selectPart(k); dragK = k; var p = xy(e); dsx = p.x; dsy = p.y; dox = lay[k].x; doy = lay[k].y; }
    function move(e){ if (!dragK) return; if (e.preventDefault) e.preventDefault(); var p = xy(e); lay[dragK].x = dox + (p.x - dsx); lay[dragK].y = doy + (p.y - dsy); apply(dragK); badgeUpd(); }
    function up(){ if (dragK) { dragK = null; save(); } }
    for (var d = 0; d < LP.length; d++) {
      (function(item){
        if (!item.el) return;
        item.el.addEventListener('mousedown', function(e){ down(item.k, e); }, false);
        item.el.addEventListener('touchstart', function(e){ down(item.k, e); }, false);
      })(LP[d]);
    }
    document.addEventListener('mousemove', move, false);
    document.addEventListener('touchmove', move, false);
    document.addEventListener('mouseup', up, false);
    document.addEventListener('touchend', up, false);

    // パーツ選択ボタン
    var pbs = document.querySelectorAll('.lfp');
    for (var p2 = 0; p2 < pbs.length; p2++) { (function(b){ b.onclick = function(){ selectPart(b.getAttribute('data-lfpart')); }; })(pbs[p2]); }
    // 操作ボタン
    var ops = document.querySelectorAll('.lfo');
    for (var o = 0; o < ops.length; o++) {
      (function(b){
        b.onclick = function(){
          var a = b.getAttribute('data-lfop');
          if (a === 'done') { exit(); return; }
          var t = lay[selKey];
          if (a === 'bigger') t.scale = Math.min(3, Math.round((t.scale + 0.1) * 10) / 10);
          else if (a === 'smaller') t.scale = Math.max(0.3, Math.round((t.scale - 0.1) * 10) / 10);
          else if (a === 'rotL') t.rot -= 15;
          else if (a === 'rotR') t.rot += 15;
          else if (a === 'reset') lay[selKey] = { x:0, y:0, rot:0, scale:1 };
          apply(selKey); badgeUpd(); save();
        };
      })(ops[o]);
    }
    document.getElementById('lfModeBtn').onclick = enter;
    document.getElementById('lfResetAll').onclick = function(){ for (var i = 0; i < LP.length; i++) lay[LP[i].k] = { x:0, y:0, rot:0, scale:1 }; applyAll(); save(); };

    load(); applyAll();
  });

  // 設定をカテゴリに振り分けて折りたたみ表示
  try {
    var secList = document.querySelectorAll('.sec');
    var bodies = {};
    for (var si = 0; si < secList.length; si++) {
      bodies[secList[si].getAttribute('data-sec')] = secList[si].querySelector('.sec-body');
    }
    var catRows = document.querySelectorAll('.row[data-cat]');
    for (var ri = 0; ri < catRows.length; ri++) {
      var cat = catRows[ri].getAttribute('data-cat');
      if (bodies[cat]) bodies[cat].appendChild(catRows[ri]);
    }
    for (var se = 0; se < secList.length; se++) {
      (function(sec){
        var head = sec.querySelector('.sec-head');
        var nm = head.getAttribute('data-name');
        function refresh(){ head.textContent = ((sec.className.indexOf('open') >= 0) ? '− ' : '＋ ') + nm; }
        head.onclick = function(){
          sec.className = (sec.className.indexOf('open') >= 0) ? 'sec' : 'sec open';
          refresh();
        };
        refresh();
      })(secList[se]);
    }
  } catch (e) {
    showErr('設定の折りたたみでエラー: ' + (e && e.message ? e.message : e));
  }

  buildMeter();
  applyLayout(savedLayout);
  render();
})();
</script>
</body>
</html>
