<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLOCK BATTLE 表示検証</title><style>body{font:14px system-ui;background:#17243b;color:#e8eefb;margin:12px}button,select{font:inherit;padding:10px;margin:8px;background:#263b5b;color:inherit;border:1px solid #8096b5;border-radius:6px}iframe{display:block;border:1px solid #789;box-sizing:content-box}pre{white-space:pre-wrap;color:#9fe0c1}a{color:#72ded3}#frame{overflow:auto}label{display:inline-block}</style><a href="/">ゲームへ</a><button id="run">9サイズを検証</button><label>表示サイズ<select id="size"></select></label><pre id="log">待機</pre><div id="frame"></div><script>
const sizes=[[320,568],[360,640],[393,740],[560,240],[568,256],[640,300],[780,320],[896,414],[1280,800]],sel=document.getElementById('size'),log=document.getElementById('log');
for(const [w,h]of sizes){let o=document.createElement('option');o.textContent=w+' × '+h;o.value=w+','+h;sel.append(o)}
async function load(w,h){let f=document.createElement('iframe');f.width=w;f.height=h;document.getElementById('frame').replaceChildren(f);await new Promise(resolve=>{f.onload=resolve;f.src='/';});let d=f.contentDocument;d.getElementById('solo').click();await new Promise(resolve=>setTimeout(resolve,150));return f}
function geometry(f){let w=f.contentWindow,d=f.contentDocument,rect=e=>{let r=e.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height,bottom:r.bottom,right:r.right}},b=rect(d.getElementById('board')),play=rect(d.getElementById('play')),buttons=[...d.querySelectorAll('.pad button,.playtools button')].map(e=>({name:e.textContent,...rect(e)})),info=rect(d.querySelector('.info')),rivals=rect(d.getElementById('rivals')),overlap=d.getElementById('rivals').children.length>0&&info.x<rivals.right&&info.right>rivals.x&&info.y<rivals.bottom&&info.bottom>rivals.y,bad=buttons.filter(r=>r.x<0||r.y<0||r.right>w.innerWidth+1||r.bottom>w.innerHeight+1);return{size:w.innerWidth+'x'+w.innerHeight,version:d.querySelector('header small').textContent,board:b,play,scrollX:d.documentElement.scrollWidth>w.innerWidth,buttonsOutside:bad.map(x=>x.name),rivalsOverlap:overlap,pass:!overlap&&b.width>=70&&b.y>=-1&&b.bottom<=w.innerHeight+1&&!bad.length&&d.documentElement.scrollWidth<=w.innerWidth}}
sel.onchange=async()=>{let f=await load(...sel.value.split(',').map(Number));log.textContent=JSON.stringify(geometry(f),null,2)};
document.getElementById('run').onclick=async()=>{log.textContent='RUN';document.getElementById('run').disabled=true;let results=[];try{for(let size of sizes){let f=await load(...size),r=geometry(f);results.push(r);log.textContent=results.map(x=>(x.pass?'PASS ':'FAIL ')+x.size+' board='+x.board.width.toFixed(1)+'×'+x.board.height.toFixed(1)+' outside='+x.buttonsOutside.join(',')).join('\n')}window.lastResults=results;sel.value='780,320';await load(780,320)}catch(e){log.textContent+='\nERROR '+e.message}document.getElementById('run').disabled=false};sel.value='780,320';sel.onchange();
</script></html>
