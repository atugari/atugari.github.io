<!doctype html><meta charset="utf-8"><title>BLOCK BATTLE browser QA</title><style>body{font:14px system-ui}button{padding:10px}pre{white-space:pre-wrap}#frames{display:flex;gap:6px;flex-wrap:wrap}iframe{width:320px;height:900px;border:1px solid #aaa}</style><button id="run">9人ブラウザ検証を実行</button><pre id="log">待機</pre><div id="frames"></div><script>
let frames=[];const $=id=>document.getElementById(id),log=s=>$('log').textContent+='\n'+s,delay=t=>new Promise(r=>setTimeout(r,t)),until=async(fn,ms=20000)=>{let end=Date.now()+ms;while(Date.now()<end){if(fn())return;await delay(100)}throw Error('Timeout')};
const key=(f,key)=>{let w=f.contentWindow;w.document.body.dispatchEvent(new w.KeyboardEvent('keydown',{key,bubbles:true}));w.document.body.dispatchEvent(new w.KeyboardEvent('keyup',{key,bubbles:true}))};
$('run').onclick=async()=>{try{$('run').disabled=true;$('log').textContent='RUN';for(let i=0;i<9;i++){let f=document.createElement('iframe');f.src='/?qa='+i;let loaded=new Promise(r=>f.onload=r);$('frames').append(f);await loaded;frames.push(f)}let code='QA'+Array.from(crypto.getRandomValues(new Uint8Array(4)),v=>v.toString(16).padStart(2,'0')).join('').toUpperCase();frames.forEach((f,i)=>{let d=f.contentDocument;d.getElementById('name').value='QA'+i;d.getElementById('n').value='9';d.getElementById('code').value=code;d.getElementById('private').click()});await until(()=>frames.every(f=>f.contentDocument.getElementById('rivals').children.length===8));log('PASS: 9画面が同室・相手8枚表示');await until(()=>frames.every(f=>f.contentDocument.getElementById('cover').textContent===''));if(new Set(frames.map(f=>f.contentDocument.getElementById('next').toDataURL())).size!==1)throw Error('NEXT mismatch');log('PASS: 共通NEXT・同時開始');if(frames.some(f=>f.contentDocument.documentElement.scrollWidth>f.contentWindow.innerWidth))throw Error('Horizontal overflow');log('PASS: 幅320pxの横はみ出しなし');let before=+frames[0].contentDocument.getElementById('score').textContent;for(let k of ['ArrowLeft','ArrowUp',' '])key(frames[0],k);await until(()=>+frames[0].contentDocument.getElementById('score').textContent>before);log('PASS: 移動・回転・ハードドロップ');for(let n=0;n<30;n++)for(let i=1;i<9;i++)key(frames[i],' ');await until(()=>frames[0].contentDocument.getElementById('status').textContent.startsWith('WIN!'));log('PASS: 8人KO後、残り1人が勝利');await until(()=>frames.every(f=>!f.contentDocument.getElementById('rematch').disabled));frames.forEach(f=>f.contentDocument.getElementById('rematch').click());await until(()=>frames.every(f=>f.contentDocument.getElementById('status').textContent.startsWith('対戦中')&&f.contentDocument.getElementById('cover').textContent===''));log('PASS: 9人が再戦を同時開始');frames[8].contentDocument.getElementById('leave').click();await until(()=>frames[0].contentDocument.querySelectorAll('#rivals article.out').length===1);log('PASS: 退室した1人をKO表示');frames[8].contentDocument.getElementById('private').click();await until(()=>frames[8].contentDocument.getElementById('status').textContent.includes('参加待ち 1 / 9'));log('PASS: 途中退室後の入り直しは次の募集へ');log('ALL BROWSER CHECKS PASSED')}catch(e){log('FAIL: '+e.message)}};
</script>
