name: Test Pareasobi analytics
on:
  pull_request:
    branches: [main]
    paths:
      - 'nanpure-api/**'
      - 'pareasobi-analytics.html'
      - 'scripts/client-overrides/public/pareasobi-analytics.js'
      - 'scripts/inject-pareasobi-analytics.py'
      - '.github/workflows/deploy-site.yml'
      - 'plaza.html'
      - 'puzzles/entry.js'
      - '.github/workflows/test-pareasobi-analytics.yml'
  push:
    branches: [main]
    paths:
      - 'nanpure-api/**'
      - '.github/workflows/test-pareasobi-analytics.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nanpure-api/package-lock.json
      - name: Install API test dependencies
        working-directory: nanpure-api
        run: npm ci --no-audit --no-fund
      - name: Run API tests
        working-directory: nanpure-api
        run: npm run build
      - name: Check tracker and build-injection syntax
        run: |
          node --check scripts/client-overrides/public/pareasobi-analytics.js
          python3 -m py_compile scripts/inject-pareasobi-analytics.py
      - name: Check dashboard script syntax
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { Script } from 'node:vm';
          const html = readFileSync('pareasobi-analytics.html', 'utf8');
          const start = html.indexOf('<script>');
          const end = html.indexOf('</script>', start + 8);
          if (start < 0 || end < 0 || html.indexOf('<script>', start + 8) >= 0) throw new Error('Expected one dashboard application script.');
          new Script(html.slice(start + 8, end), { filename: 'pareasobi-analytics.html' });
          console.log('Dashboard script syntax OK.');
          NODE
