name: Test Pareasobi analytics
on:
  pull_request:
    branches: [main]
    paths:
      - 'nanpure-api/**'
      - 'pareasobi-analytics.html'
      - 'scripts/client-overrides/public/pareasobi-analytics.js'
      - 'plaza.html'
      - 'puzzles/entry.js'
      - '.github/workflows/test-pareasobi-analytics.yml'
  push:
    branches: [main]
    paths:
      - 'nanpure-api/**'
      - '.github/workflows/test-pareasobi-analytics.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nanpure-api/package-lock.json
      - name: Install API test dependencies
        working-directory: nanpure-api
        run: npm ci --no-audit --no-fund
      - name: Run API tests
        working-directory: nanpure-api
        run: npm run build
      - name: Check tracker syntax
        run: node --check scripts/client-overrides/public/pareasobi-analytics.js
      - name: Check dashboard script syntax
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { Script } from 'node:vm';
          const html = readFileSync('pareasobi-analytics.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)];
          if (scripts.length !== 1) throw new Error('Expected one dashboard application script.');
          new Script(scripts[0][1], { filename: 'pareasobi-analytics.html' });
          console.log('Dashboard script syntax OK.');
          NODE
