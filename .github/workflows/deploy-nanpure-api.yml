name: Deploy Nanpure API to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'nanpure-api/**'
      - '.github/workflows/deploy-nanpure-api.yml'
  workflow_dispatch:
  schedule:
    - cron: "27 6,18 * * *"

permissions:
  contents: read

concurrency:
  group: cloudflare-puzzle-api
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'atugari/atugari.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check syntax and test API
        working-directory: nanpure-api
        run: npm run build

      - name: Check deployment credential
        id: credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Tests passed. Deployment is waiting for the CLOUDFLARE_API_TOKEN repository secret.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply D1 migrations and deploy puzzle-api
        if: steps.credential.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # An account ID identifies the destination; it is not a credential.
          accountId: '3fb1db1d33caddf96fec77fac7d571e6'
          workingDirectory: nanpure-api
          wranglerVersion: '4.92.0'
          packageManager: npm
          command: |
            d1 migrations apply puzzle-db --remote
            deploy

      - name: Verify Worker and D1 connection
        if: steps.credential.outputs.ready == 'true'
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const url = 'https://puzzle-api.puzzle-hub-4826.workers.dev/api/health';
          const expectedApi = JSON.parse(readFileSync('nanpure-api/package.json', 'utf8')).version;
          const expectedSite = JSON.parse(readFileSync('nanpure-version.json', 'utf8')).version;
          for (let attempt = 0; attempt < 10; attempt++) {
            try {
              const response = await fetch(url, { signal: AbortSignal.timeout(10000) });
              const result = await response.json();
              if (response.ok && result.ok === true && result.service === 'puzzle-api' && result.database === 'connected' && result.schema === 'installed' && result.version === expectedApi && result.siteVersion === expectedSite) {
                for (const path of ['/api/owner/overview', '/api/admin']) {
                  const privateResponse = await fetch(new URL(path, url), { signal: AbortSignal.timeout(10000) });
                  if (privateResponse.status !== 403) throw new Error('Private endpoint authorization check failed.');
                }
                const trialURL = new URL('/owner/wado/', url);
                const login = await fetch(trialURL, { signal: AbortSignal.timeout(10000) });
                if (login.status !== 200 || !(await login.text()).includes('管理用キー') || !login.headers.get('x-robots-tag')?.includes('noindex')) throw new Error('Owner trial login check failed.');
                for (const path of ['/owner/wado/session', '/owner/wado/assets/player.js', '/owner/wado/assets/wado-data.json']) {
                  const blocked = await fetch(new URL(path, url), { signal: AbortSignal.timeout(10000) });
                  if (blocked.status !== 401) throw new Error('Owner trial asset authorization check failed.');
                }
                const bypass = await fetch(new URL('/assets/player.js', url), { signal: AbortSignal.timeout(10000) });
                if (bypass.status !== 404) throw new Error('Owner trial asset bypass check failed.');
                appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                  `Worker deployed and D1 connected.\n\nHealth check: ${url}\n\nSchema: ${result.schema}; API: ${result.version}; site: ${result.siteVersion}. Owner endpoints reject unauthenticated requests.\n`);
                process.exit(0);
              }
            } catch {
              // Retry during deployment propagation; do not print response bodies.
            }
            if (attempt < 9) await new Promise(resolve => setTimeout(resolve, 3000));
          }
          throw new Error('Deployment finished, but Worker/D1/schema health verification failed.');
          NODE

      - name: Prepare 21 days of private daily puzzles
        if: steps.credential.outputs.ready == 'true'
        working-directory: nanpure-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/refill.mjs

      - name: Refresh private owner usage snapshot
        if: steps.credential.outputs.ready == 'true'
        working-directory: nanpure-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
        run: node scripts/owner-usage.mjs

      - name: Verify daily menus contain three puzzles and no solutions
        if: steps.credential.outputs.ready == 'true'
        run: |
          node --input-type=module <<'NODE'
          const r=await fetch('https://puzzle-api.puzzle-hub-4826.workers.dev/api/daily');
          const d=await r.json();
          if(!r.ok||d.challenges?.length!==3||JSON.stringify(d).includes('solution'))throw Error('Daily menu verification failed');
          console.log('Three daily puzzles are ready.');
          NODE
