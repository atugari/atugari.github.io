name: Deploy Nanpure vending service

on:
  push:
    branches: [nanpure-vending-staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nanpure-vending-staging
  cancel-in-progress: false

jobs:
  trial:
    if: github.repository == 'atugari/atugari.github.io' && github.ref == 'refs/heads/nanpure-vending-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: nanpure-api
    env:
      CLOUDFLARE_ACCOUNT_ID: '3fb1db1d33caddf96fec77fac7d571e6'
      WRANGLER_SEND_METRICS: 'false'
      NANPURE_VENDING_PUBLIC_PLAY: '1'
      NANPURE_PILOT_PRESERVE_OWNER: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify pilot code
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Prepare and deploy the isolated trial
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Cloudflare deployment credential is unavailable.' >&2; exit 1; }
          db_name=nanpure-vending-pilot-db
          lookup() {
            npx --no-install wrangler d1 list --json | node --input-type=module -e '
              import {readFileSync} from "node:fs";
              const matches = JSON.parse(readFileSync(0, "utf8")).filter(item => item.name === process.argv[1]);
              if (matches.length > 1) throw Error("Duplicate trial database name");
              if (matches.length) process.stdout.write(matches[0].uuid || "");
            ' "$db_name"
          }
          trial_id="$(lookup)"
          if ! [[ "$trial_id" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$ ]]; then
            echo 'Trial database ID could not be verified.' >&2
            exit 1
          fi
          production_id="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync("wrangler.jsonc","utf8")).d1_databases[0].database_id)')"
          test "$trial_id" != "$production_id"
          export NANPURE_PILOT_DB_ID="$trial_id"
          node pilot/prepare.mjs
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          const c = JSON.parse(readFileSync('pilot/wrangler.generated.json', 'utf8'));
          if (c.name !== 'nanpure-vending-pilot' || c.d1_databases.length !== 1 ||
              c.d1_databases[0].database_name !== 'nanpure-vending-pilot-db' ||
              c.d1_databases[0].database_id !== process.env.NANPURE_PILOT_DB_ID ||
              c.vars.VENDING_CATALOGUE_ENABLED !== '1' ||
              c.vars.VENDING_PUBLIC_PLAY !== process.env.NANPURE_VENDING_PUBLIC_PLAY ||
              c.keep_vars !== true || Object.hasOwn(c.vars, 'OWNER_KEY_HASH') ||
              c.routes?.length || c.route) throw Error('Unverified pilot deployment destination');
          JS
          node --input-type=module - <<'JS'
          const trial = await fetch('https://nanpure-vending-pilot.puzzle-hub-4826.workers.dev/nanpure/vending/',
            {signal: AbortSignal.timeout(10000)});
          if (!trial.ok || !/試験用の管理者キー/.test(await trial.text())) throw Error('Existing private trial was not verified');
          JS
          npx --no-install wrangler d1 migrations apply DB --remote --config pilot/wrangler.generated.json
          npx --no-install wrangler deploy --config pilot/wrangler.generated.json | tee "$RUNNER_TEMP/vending-trial-deploy.log"
      - name: Check public stock and restricted owner access
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          const log = readFileSync(process.env.RUNNER_TEMP + '/vending-trial-deploy.log', 'utf8');
          const origin = log.match(/https:\/\/nanpure-vending-pilot\.[a-z0-9-]+\.workers\.dev\b/)?.[0];
          if (!origin) throw Error('Verified trial HTTPS URL was not present in deploy output');
          let checked = false;
          for (let i = 0; i < 6; i++) {
            try {
              const page = await fetch(origin + '/nanpure/vending/', {signal:AbortSignal.timeout(10000)});
              const worker = await fetch(origin + '/api/vending/worker', {
                method:'POST',headers:{'Content-Type':'application/json'},
                body:JSON.stringify({action:'poll'}),signal:AbortSignal.timeout(10000)
              });
              const originHeader = 'https://atugari.github.io';
              const shelf = await fetch(origin + '/api/vending/public', {
                headers: {Origin: originHeader}, signal: AbortSignal.timeout(10000)
              });
              const owner = await fetch(origin + '/api/vending/admin', {signal: AbortSignal.timeout(10000)});
              const privateShelf = await fetch(origin + '/api/vending', {signal: AbortSignal.timeout(10000)});
              const preflight = await fetch(origin + '/api/vending/public', {
                method: 'OPTIONS', signal: AbortSignal.timeout(10000),
                headers: {Origin: originHeader, 'Access-Control-Request-Method': 'POST',
                  'Access-Control-Request-Headers': 'content-type,x-nanpure-key'}
              });
              const profiles = shelf.ok ? (await shelf.json()).profiles : null;
              if (page.ok && /試験用の管理者キー/.test(await page.text()) && worker.status === 403 &&
                  owner.status === 403 && privateShelf.status === 401 &&
                  shelf.headers.get('access-control-allow-origin') === originHeader &&
                  !shelf.headers.has('access-control-allow-credentials') &&
                  Array.isArray(profiles) && profiles.every(profile => profile.available > 0) &&
                  preflight.ok && preflight.headers.get('access-control-allow-origin') === originHeader) {
                checked = true;
                break;
              }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 3000));
          }
          if (!checked) throw Error('Public stock or private trial access controls could not be verified');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Isolated trial\n\n' + origin + '/nanpure/vending/\n');
          console.log('Verified isolated trial: ' + origin + '/nanpure/vending/');
          JS
