name: Stage Othello reading and translation fix

on:
  push:
    branches: [codex/pareasobi-worker-check-20261117]
    paths: [.github/workflows/check-pareasobi-game-deployments.yml]

permissions:
  contents: read

jobs:
  stage:
    if: github.repository == 'atugari/atugari.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stage the verified frontend changes
        run: python3 scripts/stage-othello-reading.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
