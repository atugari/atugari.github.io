name: Publish Othello 100 languages and reading controls

on:
  push:
    branches: [codex/pareasobi-worker-check-20261117]
    paths: [.github/workflows/check-pareasobi-game-deployments.yml]

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'atugari/atugari.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish searchable languages and sentence readings
        run: python3 scripts/publish-othello-100.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
