name: Publish Othello furigana corrections

on:
  push:
    branches: [codex/pareasobi-worker-check-20261117]
    paths: [.github/workflows/check-pareasobi-game-deployments.yml]

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'atugari/atugari.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Update the checked Othello interface
        run: python3 scripts/repair-othello-routing.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
