name: Build and deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Kuroshiro dependencies
        working-directory: kuroshiro
        run: npm install --no-audit --no-fund

      - name: Build Kuroshiro
        working-directory: kuroshiro
        run: npm run build

      - name: Assemble whole site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='node_modules/' \
            --exclude='nanpure-api/' \
            --exclude='owner-app/' \
            --exclude='.openai/' \
            --exclude='kuroshiro/'
          mkdir -p _site/kuroshiro
          cp -a kuroshiro/dist-pages/. _site/kuroshiro/
          touch _site/.nojekyll

      - name: Bundle Nanpure help and contact
        run: python3 scripts/enhance-nanpure.py _site

      - name: Check Nanpure keyboard and mobile client before publication
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/nanpure-browser" --no-audit --no-fund playwright@1.62.1 linkedom@0.18.13
          node scripts/check-nanpure-i18n.cjs "$RUNNER_TEMP/nanpure-browser/node_modules/linkedom"
          node scripts/check-nanpure-input.cjs scripts/client-overrides/public/notebook/app.js "$RUNNER_TEMP/nanpure-browser/node_modules/linkedom"
          node scripts/check-nanpure-special-keyboard.cjs "$RUNNER_TEMP/nanpure-browser/node_modules/linkedom"
          node scripts/check-nanpure-ui.cjs scripts/client-overrides/public/notebook "$RUNNER_TEMP/nanpure-browser/node_modules/linkedom"
          node scripts/check-nanpure-selection.cjs "$RUNNER_TEMP/nanpure-browser/node_modules/linkedom"
          node scripts/check-nanpure-keybindings.cjs "$RUNNER_TEMP/nanpure-browser/node_modules/linkedom"
          node scripts/check-nanpure-visit-stats.cjs
          node scripts/check-nanpure-board-gestures.cjs scripts/client-overrides/public/notebook/board-input.js "$RUNNER_TEMP/nanpure-browser/node_modules/linkedom"
          node scripts/check-nanpure-shell-lifecycle.cjs scripts/client-overrides/app/game.tsx
          node --experimental-vm-modules scripts/check-nanpure-pages.cjs "$RUNNER_TEMP/nanpure-browser/node_modules/linkedom"
          node --experimental-vm-modules scripts/check-nanpure-ranking.cjs "$RUNNER_TEMP/nanpure-browser/node_modules/linkedom"
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/nanpure-browser/node_modules/playwright"
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node scripts/check-nanpure-keyboard-dialogs.cjs
          node scripts/check-nanpure-languages-browser.cjs _site
          node scripts/check-nanpure-browser.cjs _site
          node scripts/check-nanpure-keyboard-browser.cjs _site
          node scripts/check-nanpure-smooth-play.cjs _site
          node scripts/check-nanpure-keybindings-browser.cjs _site
          node scripts/check-nanpure-appearance-browser.cjs _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
