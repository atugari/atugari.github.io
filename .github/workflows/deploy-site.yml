name: Build and deploy GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Kuroshiro dependencies
        working-directory: kuroshiro
        run: npm install --no-audit --no-fund

      - name: Build Kuroshiro
        working-directory: kuroshiro
        run: npm run build

      - name: Assemble whole site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='node_modules/' \
            --exclude='nanpure-api/' \
            --exclude='owner-app/' \
            --exclude='.openai/' \
            --exclude='kuroshiro/'
          mkdir -p _site/kuroshiro
          cp -a kuroshiro/dist-pages/. _site/kuroshiro/
          touch _site/.nojekyll

      - name: Bundle Nanpure help and contact
        run: python3 scripts/enhance-nanpure.py _site

      - name: Check Nanpure keyboard and mobile client before publication
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/nanpure-browser" --no-audit --no-fund playwright@1.62.1 linkedom@0.18.13
          npm run build --prefix nanpure-api
          node scripts/check-pareasobi-move.cjs
          node scripts/check-pareasobi-navigation.cjs
          node --experimental-vm-modules scripts/collection-100k/check-filters.cjs
          node scripts/check-public-release-policy.cjs
          node scripts/check-nanpure-mixed-multi.cjs
          node scripts/check-nanpure-board-comfort.cjs "$RUNNER_TEMP/nanpure-browser/node_modules/linkedom"
          node scripts/collection-100k/audit-playable.cjs
          node scripts/check-nanpure-achievements.cjs
          node scripts/check-nanpure-achievements-ui.cjs "$RUNNER_TEMP/nanpure-browser/node_modules/linkedom"
          node scripts/check-nanpure-i18n-delta.cjs
          node scripts/check-nanpure-search.cjs "$RUNNER_TEMP/nanpure-browser/node_modules/linkedom"
          python3 scripts/check-nanpure-wado-dictionary.py
          node scripts/check-nanpure-wado-interaction.cjs "$RUNNER_TEMP/nanpure-browser/node_modules/linkedom"
          node scripts/check-nanpure-wado-play.cjs
          node scripts/check-nanpure-wado.cjs
          node scripts/check-nanpure-wado-web-ui.cjs "$RUNNER_TEMP/nanpure-browser/node_modules/linkedom"
          node scripts/check-nanpure-wado-batch.cjs "$RUNNER_TEMP/nanpure-browser/node_modules/linkedom"
          node scripts/check-nanpure-magic.cjs
          node scripts/check-nanpure-i18n.cjs "$RUNNER_TEMP/nanpure-browser/node_modules/linkedom"
          node scripts/check-nanpure-input.cjs scripts/client-overrides/public/notebook/app.js "$RUNNER_TEMP/nanpure-browser/node_modules/linkedom"
          node scripts/check-nanpure-special-keyboard.cjs "$RUNNER_TEMP/nanpure-browser/node_modules/linkedom"
          node scripts/check-nanpure-ui.cjs scripts/client-overrides/public/notebook "$RUNNER_TEMP/nanpure-browser/node_modules/linkedom"
          node scripts/check-nanpure-selection.cjs "$RUNNER_TEMP/nanpure-browser/node_modules/linkedom"
          node scripts/check-nanpure-keybindings.cjs "$RUNNER_TEMP/nanpure-browser/node_modules/linkedom"
          node scripts/check-nanpure-visit-stats.cjs
          node scripts/check-nanpure-board-gestures.cjs scripts/client-overrides/public/notebook/board-input.js "$RUNNER_TEMP/nanpure-browser/node_modules/linkedom"
          node scripts/check-nanpure-shell-lifecycle.cjs scripts/client-overrides/app/game.tsx
          node --experimental-vm-modules scripts/check-nanpure-pages.cjs "$RUNNER_TEMP/nanpure-browser/node_modules/linkedom"
          node scripts/check-nanpure-cloud-notice.cjs "$RUNNER_TEMP/nanpure-browser/node_modules/linkedom"
          node --experimental-vm-modules scripts/check-nanpure-cloud.cjs "$RUNNER_TEMP/nanpure-browser/node_modules/linkedom"
          node --experimental-vm-modules scripts/check-nanpure-ranking.cjs "$RUNNER_TEMP/nanpure-browser/node_modules/linkedom"
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/nanpure-browser/node_modules/playwright"
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node scripts/check-nanpure-comfort-browser.cjs _site
          node scripts/check-nanpure-smooth-play.cjs _site
          node scripts/check-pareasobi-move-browser.cjs _site
          node scripts/check-nanpure-search-browser.cjs _site
          node scripts/check-nanpure-home-titles-browser.cjs _site
          node scripts/check-nanpure-keyboard-dialogs.cjs
          node scripts/check-nanpure-wado-browser.cjs _site
          node scripts/check-nanpure-magic-browser.cjs _site
          node scripts/check-nanpure-audio-browser.cjs _site
          node scripts/check-nanpure-languages-browser.cjs _site
          node scripts/check-nanpure-browser.cjs _site
          node scripts/check-nanpure-keyboard-browser.cjs _site
          node scripts/check-nanpure-keybindings-browser.cjs _site
          node scripts/check-nanpure-appearance-browser.cjs _site

      - name: Verify appended puzzle uniqueness
        run: node scripts/collection-100k/check-append.cjs

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  wado-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated verification dependencies
        timeout-minutes: 6
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/wado-browser" --no-audit --no-fund playwright@1.62.1 linkedom@0.18.13
          "$RUNNER_TEMP/wado-browser/node_modules/.bin/playwright" install --with-deps webkit
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk poppler-utils
          python3 -m venv "$RUNNER_TEMP/wado-python"
          "$RUNNER_TEMP/wado-python/bin/pip" install pypdf==6.10.0 pdfplumber==0.11.9
      - name: Check hint state and reviewed vocabulary
        run: |
          node scripts/check-nanpure-wado-hint-matrix.cjs "$RUNNER_TEMP/wado-browser/node_modules/linkedom" docs/wado-verification-20261027/hint-matrix.json
          node scripts/wado/compare-generation-20261027.cjs
          node scripts/check-nanpure-wado-review.cjs
          node scripts/wado/build-print-fixture-20261027.cjs
      - name: Export and inspect four actual A4 PDFs
        shell: bash
        run: |
          node -e 'const f=require("fs"),v=require("./nanpure/version.json").version;f.mkdirSync(".wado-site/nanpure/releases",{recursive:true});f.copyFileSync("nanpure/version.json",".wado-site/nanpure/version.json");f.cpSync("nanpure/releases/"+v,".wado-site/nanpure/releases/"+v,{recursive:true});'
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/wado-browser/node_modules/playwright"
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node scripts/check-nanpure-wado-pdf.cjs .wado-site wado-verification-output
          "$RUNNER_TEMP/wado-python/bin/python" scripts/wado/check-pdf-20261027.py wado-verification-output
          cp -a docs/wado-verification-20261027/. wado-verification-output/
          cp scripts/wado/review-20261027.json scripts/client-overrides/public/notebook/wado-licenses.txt wado-verification-output/
      - name: Upload reviewable PDFs and comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wado-verification-${{ github.sha }}
          path: wado-verification-output
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, wado-verification]
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
