name: Pareasobi promo tests

on:
  pull_request:
    paths:
      - "scripts/pareasobi-promo/**"
      - "nanpure-x-promo-worker/**"
      - ".github/workflows/pareasobi-promo-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test isolated promotion planner and localized copy
        run: python -m unittest discover -s scripts/pareasobi-promo -p 'test_*.py' -v
