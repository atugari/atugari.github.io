name: Build Wado Print Android and Windows
on:
  push:
    branches: [codex/wado-print-native]
    paths: ['wado-print-app/**', '.github/workflows/build-wado-print.yml']
permissions:
  contents: read
concurrency:
  group: wado-print-native
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build offline page
        run: python3 wado-print-app/build_web.py
      - name: Install matching SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build unsigned app and test APK
        working-directory: wado-print-app/android
        run: gradle --no-daemon :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android app and native print dialog
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: wado-print-app/android
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest
            mkdir -p ../../wado-android-artifact/qa
            adb pull /sdcard/Android/data/jp.atugari.wadoprint/files/. ../../wado-android-artifact/qa/
      - name: Prepare unsigned artifact and test evidence
        if: always()
        shell: bash
        run: |
          mkdir -p wado-android-artifact/qa
          cp wado-print-app/android/app/build/outputs/apk/release/app-release-unsigned.apk wado-android-artifact/wado-print-2.1.0-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" wado-android-artifact/apksigner.jar
          adb pull /sdcard/Android/data/jp.atugari.wadoprint/files/. wado-android-artifact/qa/ || true
          cp -r wado-print-app/android/app/build/reports/androidTests wado-android-artifact/qa/ || true
          sha256sum wado-android-artifact/wado-print-2.1.0-unsigned.apk wado-android-artifact/apksigner.jar > wado-android-artifact/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: wado-print-android-2.1.0-unsigned, path: wado-android-artifact/, retention-days: 14, if-no-files-found: error}
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Build offline page
        run: python wado-print-app/build_web.py
      - name: Build standalone executable
        run: dotnet publish wado-print-app/windows/WadoPrint.csproj -c Release -r win-x64 --self-contained true -o wado-windows-artifact
      - name: Ensure official WebView2 runtime
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application")) {
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP\WebView2Setup.exe"
            Start-Process "$env:RUNNER_TEMP\WebView2Setup.exe" -ArgumentList '/silent /install' -Wait
          }
      - name: Launch executable and verify A4 PDF
        shell: pwsh
        run: |
          $evidence = Join-Path $PWD 'wado-windows-artifact/qa'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          $process = Start-Process './wado-windows-artifact/WadoPrint.exe' -ArgumentList @('--smoke-test', $evidence) -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Desktop smoke test timed out' }
          if ($process.ExitCode -ne 0) { Get-Content "$evidence/windows-failure.txt" -ErrorAction SilentlyContinue; throw "Desktop smoke test failed: $($process.ExitCode)" }
          Get-Content "$evidence/windows-smoke.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: wado-print-windows-2.1.0, path: wado-windows-artifact/, retention-days: 14, if-no-files-found: error}

