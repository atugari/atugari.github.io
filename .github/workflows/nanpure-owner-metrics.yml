name: Update private Nanpure owner metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'

permissions:
  contents: read

concurrency:
  group: nanpure-owner-metrics
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.repository == 'atugari/atugari.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Refresh private metrics without rebuilding or generating puzzles
        working-directory: nanpure-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
        run: node scripts/owner-usage.mjs
