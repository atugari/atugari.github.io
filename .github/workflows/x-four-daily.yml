name: X daily four puzzles

on:
  push:
    branches: [main]
    paths: ['scripts/x-four/**', '.github/workflows/x-four-daily.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview: images only / check: X account only / publish: one real post'
        type: choice
        options: [preview, check, publish]
        default: preview
      slot:
        description: 'Japan-time post slot'
        type: choice
        options: ['08:00', '12:00', '18:00', '21:00']
        default: '08:00'
  schedule:
    - cron: '0 8 * * *'
      timezone: Asia/Tokyo
    - cron: '0 12 * * *'
      timezone: Asia/Tokyo
    - cron: '0 18 * * *'
      timezone: Asia/Tokyo
    - cron: '0 21 * * *'
      timezone: Asia/Tokyo

permissions:
  contents: read

concurrency:
  group: x-four-daily
  cancel-in-progress: false

jobs:
  prepare-or-post:
    # Enabled after the verified @parade166 connection check on 2026-10-25.
    # Set the repository variable X_FOUR_POST_ENABLED=false to pause posts.
    if: github.event_name != 'schedule' || (vars.X_FOUR_POST_ENABLED || 'true') == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer dependencies
        run: |
          python -m pip install -r scripts/x-four/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Check publication guards
        run: python -m unittest discover -s scripts/x-four -p 'test_*.py' -v
      - name: Check X posting account before preview
        if: github.event_name == 'push'
        env:
          X_FOUR_MODE: check
          X_EXPECTED_USERNAME: parade166
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python scripts/x-four/run.py
      - name: Prepare four questions or publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_ROOT: ${{ github.workspace }}
          X_FOUR_MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.mode || 'preview' }}
          X_FOUR_SCHEDULE: ${{ github.event.schedule || '' }}
          X_FOUR_SLOT: ${{ inputs.slot || '08:00' }}
          X_FOUR_POST_ENABLED: ${{ vars.X_FOUR_POST_ENABLED || 'true' }}
          X_FOUR_INCLUDE_URL: ${{ vars.X_FOUR_INCLUDE_URL || 'false' }}
          X_EXPECTED_USERNAME: parade166
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python scripts/x-four/run.py
      - name: Save question images and post text
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.mode != 'check')
        uses: actions/upload-artifact@v4
        with:
          name: x-four-questions-${{ github.run_id }}
          path: ${{ runner.temp }}/x-four-work/output/
          if-no-files-found: error
          retention-days: 7
