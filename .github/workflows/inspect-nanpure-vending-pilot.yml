name: Inspect isolated Nanpure vending Worker

on:
  push:
    branches: [nanpure-vending-pilot]
    paths:
      - '.github/workflows/inspect-nanpure-vending-pilot.yml'
      - '.github/nanpure-vending-pilot/inspect.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inspect-nanpure-vending-pilot
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'atugari/atugari.github.io' && github.ref == 'refs/heads/nanpure-vending-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Inspect only the existing pilot Worker without changing it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 .github/nanpure-vending-pilot/inspect.py
