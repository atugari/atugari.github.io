name: Inspect X puzzle queue (read only)

on:
  push:
    branches: [codex/x-four-date-repair-20261102]
    paths: ['.github/workflows/x-four-inspect.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read live slot status without changing the queue or posting
        env:
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          node --input-type=module <<'JS'
          import {createHash} from 'node:crypto';
          import {send} from './scripts/x-four/queue_http.mjs';
          const a=process.env.X_API_SECRET,b=process.env.X_ACCESS_TOKEN_SECRET;
          if(!a||!b)throw Error('Required queue authentication is unavailable');
          const token=createHash('sha256').update('nanpure-x-queue-v1\0'+a+'\0'+b).digest('hex');
          const result=await send({url:'https://nanpure-x-scheduler.puzzle-hub-4826.workers.dev/state',authorization:'Bearer '+token});
          if(result.status!==200||!result.data?.posts)throw Error('Queue state could not be verified: HTTP '+result.status);
          const rows=Object.entries(result.data.posts).filter(([key])=>key>='2026-10-30').map(([key,p])=>{
            if(!/^\d{4}-\d{2}-\d{2}@(08|12|18|21):00$/.test(key))throw Error('Unexpected slot key');
            if(!['assembling','ready','posting','sent','failed','expired','archived'].includes(p.status))throw Error('Unexpected slot status');
            return {key,status:p.status,...(/^\d+$/.test(String(p.post_id||''))?{post_id:String(p.post_id)}:{})};
          });
          console.log(JSON.stringify({checked_at:new Date().toISOString(),enabled:result.data.enabled,slots:rows}));
          JS
